    <link rel="icon" type="image/png" sizes="32x32" href="battery-bandits-logo-32.png" />

    <link data-trunk rel="rust" data-wasm-opt="z" />
    <script>
      // Gespeichertes Farbschema sofort setzen, damit die Seite beim Laden nicht aufblitzt.
      try {
        var theme = localStorage.getItem("bb-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        if (localStorage.getItem("bb-contrast") === "high") document.documentElement.dataset.contrast = "high";
        if (localStorage.getItem("bb-density") === "compact") document.documentElement.dataset.density = "compact";
      } catch (e) {}
    </script>
