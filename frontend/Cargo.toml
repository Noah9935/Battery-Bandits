[package]
name = "frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Weboberfläche von Battery Bandits (Leptos, WebAssembly)"

[dependencies]
shared = { workspace = true }
chrono = { workspace = true }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = "0.3"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document", "Element", "EventSource", "HtmlElement", "HtmlInputElement", "Location", "MediaQueryList",
    "MessageEvent", "Storage", "Window",
] }
