<!DOCTYPE html>
<html lang="de" data-theme="light" data-layout="desktop">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battery Bandits</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#f3f0eb; --panel:#fff; --panel-2:#faf8f4; --hover:#f7f3ed;
    --border:#e8e2d9; --border-strong:#d8d0c4;
    --text:#26232a; --text-dim:#7c756d;
    --mask:#2a272d; --mask-2:#36323a; --fur:#9a928a; --side-text:#ece6de; --side-dim:#a39b92;
    --accent:#b87428; --accent-strong:#94591a; --accent-bg:#f8ebda;
    --ok:#3d8a62; --ok-bg:#e7f3ec; --warn:#c08417; --warn-bg:#fbf1dc;
    --crit:#c84d38; --crit-bg:#fbe9e5; --off:#8f877f; --off-bg:#efebe6;
    --shadow:0 1px 2px rgba(42,39,45,.06); --shadow-md:0 12px 32px rgba(42,39,45,.16);
    --font:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --stripes:repeating-linear-gradient(90deg,var(--mask) 0 18px,var(--fur) 18px 36px);
  }
  html[data-theme=dark] {
    --bg:#131215; --panel:#1c1a1f; --panel-2:#211f25; --hover:#27242b;
    --border:#2e2b32; --border-strong:#3c3840;
    --text:#ece6de; --text-dim:#9d958c;
    --mask:#0d0c0f; --mask-2:#1d1b20; --fur:#6e675f;
    --accent:#e3a55b; --accent-strong:#f0b977; --accent-bg:#33281a;
    --ok:#5cc08e; --ok-bg:#17301f; --warn:#e3b04c; --warn-bg:#33290f;
    --crit:#ef7d63; --crit-bg:#3a1e19; --off:#a39b92; --off-bg:#29262c;
    --shadow:none; --shadow-md:0 12px 32px rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font-family:inherit; font-size:inherit; color:inherit; }
  .ico { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
  .stripes { height:6px; background:var(--stripes); border-radius:3px; }

  /* ---------- Login ---------- */
  .login { position:fixed; inset:0; z-index:3000; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(circle at 30% 20%, var(--mask-2), var(--mask) 70%); }
  .login[hidden] { display:none; }
  .login-card { width:100%; max-width:380px; background:var(--panel); border-radius:20px; padding:30px 28px 26px; box-shadow:var(--shadow-md); text-align:center; }
  .login-card .stripes { margin:18px -28px 22px; border-radius:0; }
  .login-card h1 { margin:12px 0 2px; font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .login-card p { margin:0; color:var(--text-dim); font-size:13px; }
  .login-card form { display:flex; flex-direction:column; gap:10px; text-align:left; }
  .login-card label { font-size:12px; font-weight:700; color:var(--text-dim); }
  .login-card input { padding:11px 13px; font-size:14px; }
  .login-hint { font-size:11.5px; color:var(--text-dim); background:var(--accent-bg); border-radius:8px; padding:8px 10px; }
  .login-error { color:var(--crit); font-size:12.5px; font-weight:700; min-height:16px; }
  .shake { animation:shake .35s; }
  @keyframes shake { 25% { transform:translateX(-6px); } 50% { transform:translateX(6px); } 75% { transform:translateX(-3px); } }

  /* ---------- Layout ---------- */
  .app { display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
  .app[hidden] { display:none; }
  .sidebar { background:var(--mask); color:var(--side-text); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:11px; padding:22px 20px 16px; background:none; border:none; color:inherit; text-align:left; cursor:pointer; width:100%; }
  .brand:hover .brand-name { color:var(--accent); }
  .brand-name { font-weight:800; font-size:16px; letter-spacing:-.01em; }
  .brand-sub { color:var(--side-dim); font-size:11.5px; margin-top:1px; }
  .sidebar > .stripes { margin:0 20px 14px; opacity:.9; }
  .nav { display:flex; flex-direction:column; padding:4px 12px; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 12px; color:var(--side-dim); font-weight:700; font-size:13.5px; border-radius:10px; border:none; background:none; cursor:pointer; text-align:left; position:relative; }
  .nav-item:hover { color:var(--side-text); background:rgba(255,255,255,.04); }
  .nav-item.active { color:var(--side-text); background:rgba(255,255,255,.08); }
  .nav-item.active::before { content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:4px; border-radius:0 4px 4px 0; background:var(--accent); }
  .nav-item .lbl { flex:1; }
  .badge { background:var(--crit); color:#fff; border-radius:10px; font-size:10.5px; font-weight:800; padding:1px 7px; line-height:16px; }
  .badge:empty { display:none; }
  .badge.amber { background:var(--accent); }
  .side-foot { margin-top:auto; padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,.07); display:flex; flex-direction:column; gap:8px; }
  .side-user { display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--fur); color:var(--mask); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none; }
  .side-btn { display:flex; align-items:center; gap:9px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:var(--side-text); padding:8px 11px; border-radius:9px; cursor:pointer; font-weight:700; font-size:12.5px; }
  .side-btn:hover { background:rgba(255,255,255,.1); }
  .sync { font-size:11px; color:var(--side-dim); display:flex; align-items:center; gap:6px; }
  .sync .dot { background:var(--ok); }

  .main { padding:30px 38px 56px; min-width:0; }
  .page { display:none; }
  .page.active { display:block; }
  .topbar { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .topbar-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .page-title { font-size:22px; font-weight:800; margin:0; letter-spacing:-.015em; }
  .page-sub { color:var(--text-dim); font-size:13px; margin-top:4px; }

  /* ---------- Controls ---------- */
  .btn { display:inline-flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--border-strong); padding:8px 14px; border-radius:10px; font-size:12.5px; cursor:pointer; font-weight:700; box-shadow:var(--shadow); white-space:nowrap; text-decoration:none; color:var(--text); }
  .btn:hover { border-color:var(--accent); color:var(--accent-strong); }
  .btn .ico { width:16px; height:16px; }
  .btn-sm { padding:5px 10px; font-size:11.5px; border-radius:8px; }
  .btn-ghost { background:transparent; box-shadow:none; }
  .btn-primary { background:var(--mask); border-color:var(--mask); color:#fff; }
  html[data-theme=dark] .btn-primary { background:var(--accent); border-color:var(--accent); color:#1c1a1f; }
  .btn-primary:hover { color:#fff; opacity:.9; border-color:var(--mask); }
  html[data-theme=dark] .btn-primary:hover { color:#1c1a1f; border-color:var(--accent); }
  .btn-danger:hover { border-color:var(--crit); color:var(--crit); }
  .btn[disabled] { opacity:.5; pointer-events:none; }
  .link { background:none; border:none; padding:0; color:var(--accent-strong); cursor:pointer; font-weight:800; font-size:12px; text-decoration:none; }
  .link:hover { text-decoration:underline; }
  input[type=search], input[type=text], input[type=email], input[type=password], input[type=number], input[type=datetime-local], select, textarea {
    background:var(--panel); border:1px solid var(--border-strong); padding:8px 11px; border-radius:10px; font-size:12.5px; min-width:0;
  }
  textarea { resize:vertical; min-height:80px; width:100%; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  input[type=range] { accent-color:var(--accent); width:100%; }
  input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); }
  .card h2 { font-size:15px; margin:0 0 4px; font-weight:800; }
  .card h3 { font-size:11px; margin:0 0 12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:800; }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .card-head h3, .card-head h2 { margin:0; }
  .muted { color:var(--text-dim); }
  .sub { font-size:11.5px; margin-top:2px; font-weight:400; color:var(--text-dim); }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .stack { display:flex; flex-direction:column; gap:14px; }

  /* ---------- Status ---------- */
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:800; white-space:nowrap; }
  .pill .dot { background:currentColor; }
  .s-ok { color:var(--ok); background:var(--ok-bg); }
  .s-crit { color:var(--crit); background:var(--crit-bg); }
  .s-offline { color:var(--off); background:var(--off-bg); }
  .s-open { color:var(--crit); background:var(--crit-bg); }
  .s-progress { color:var(--warn); background:var(--warn-bg); }
  .s-done { color:var(--ok); background:var(--ok-bg); }
  .p-high { color:var(--crit); } .p-med { color:var(--warn); } .p-low { color:var(--text-dim); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }
  .l-green { background:var(--ok); } .l-yellow { background:var(--warn); } .l-red { background:var(--crit); } .l-offline { background:var(--off); }
  .c-l-green { color:var(--ok); } .c-l-yellow { color:var(--warn); } .c-l-red { color:var(--crit); } .c-l-offline { color:var(--off); }
  .tchip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:7px; background:var(--accent-bg); color:var(--accent-strong); border:none; cursor:pointer; white-space:nowrap; }
  .tchip .ico { width:13px; height:13px; }
  .tchip.none { background:transparent; color:var(--text-dim); border:1px dashed var(--border-strong); }

  /* ---------- Übersicht ---------- */
  .summary-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .summary-card { text-align:left; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:15px 18px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s, box-shadow .15s; position:relative; overflow:hidden; }
  .summary-card:hover { border-color:var(--border-strong); }
  .summary-card.active { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
  .summary-card.active::after { content:''; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--stripes); }
  .summary-label { font-size:12px; color:var(--text-dim); margin-bottom:6px; display:flex; align-items:center; gap:6px; font-weight:700; }
  .summary-value { font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .summary-hint { font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .v-ok { color:var(--ok); } .v-crit { color:var(--crit); } .v-offline { color:var(--off); } .v-amber { color:var(--accent-strong); }

  .alerts { background:var(--panel); border:1px solid var(--border); border-radius:14px; margin-bottom:16px; overflow:hidden; box-shadow:var(--shadow); }
  .alerts.none { display:flex; align-items:center; gap:10px; padding:12px 16px; color:var(--text-dim); font-size:12.5px; }
  .alerts-head { display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1px solid var(--border); background:var(--crit-bg); }
  .alerts-head b { color:var(--crit); font-size:13px; }
  .alert { display:grid; grid-template-columns:auto 64px 1fr auto auto auto; align-items:center; gap:12px; padding:9px 16px; border-bottom:1px solid var(--border); font-size:12.5px; border-left:3px solid transparent; cursor:pointer; }
  .alert:hover { background:var(--hover); }
  .alert:last-child { border-bottom:none; }
  .alert .a-id { font-weight:800; color:var(--accent-strong); }
  .alert .a-go { color:var(--text-dim); font-size:11.5px; font-weight:700; white-space:nowrap; }
  .alert.sev-high { border-left-color:var(--crit); } .alert.sev-high > .dot { background:var(--crit); }
  .alert.sev-med { border-left-color:var(--warn); } .alert.sev-med > .dot { background:var(--warn); }
  .alert .when { color:var(--text-dim); font-size:11.5px; white-space:nowrap; }

  .filter-bar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .filter-bar input[type=search] { flex:1 1 240px; }
  .check { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); cursor:pointer; font-weight:700; }

  .table-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .scroll-x { overflow-x:auto; }
  .device-table { width:100%; border-collapse:collapse; }
  .device-table th { text-align:left; font-size:11px; font-weight:800; color:var(--text-dim); padding:12px 14px 10px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.05em; background:var(--panel-2); white-space:nowrap; user-select:none; }
  .device-table th.sortable { cursor:pointer; }
  .device-table th.sortable:hover, .device-table th.sorted { color:var(--text); }
  .device-table th .arr { opacity:.3; margin-left:4px; }
  .device-table th.sorted .arr { opacity:1; color:var(--accent); }
  .device-table td { padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  .device-table tr.row { cursor:pointer; }
  .device-table tr.row:hover td { background:var(--hover); }
  .device-table tr.row.open td { background:var(--hover); border-bottom-color:transparent; }
  .device-table tr.row.st-crit td:first-child { box-shadow:inset 3px 0 0 var(--crit); }
  .device-table tr.row.st-offline td:first-child { box-shadow:inset 3px 0 0 var(--off); }
  .device-table tbody tr:last-child td { border-bottom:none; }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chev { width:28px; color:var(--text-dim); font-size:12px; }
  .id-cell { font-weight:800; font-variant-numeric:tabular-nums; }
  .battery-cell { display:flex; align-items:center; gap:10px; }
  .bar { width:84px; height:7px; background:var(--off-bg); border-radius:4px; overflow:hidden; flex:none; }
  .fill { height:100%; border-radius:4px; }
  .pct { font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:800; white-space:nowrap; }
  .battery-cell.is-off .pct { color:var(--text-dim); font-weight:600; }
  tr.expand td { background:var(--hover); padding:4px 14px 18px 56px; }
  .expand-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px 24px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .tag { font-size:11.5px; padding:4px 10px; border-radius:7px; font-weight:700; }
  .tag.sev-high { background:var(--crit-bg); color:var(--crit); }
  .tag.sev-med { background:var(--warn-bg); color:var(--warn); }
  .row-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .kv { display:flex; flex-direction:column; gap:2px; margin-bottom:10px; }
  .kv > span { font-size:11px; color:var(--text-dim); font-weight:700; }
  .kv > b { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .table-foot { font-size:11.5px; color:var(--text-dim); margin-top:10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .empty { padding:30px 20px; text-align:center; color:var(--text-dim); font-size:13px; }
  .empty svg { display:block; margin:0 auto 10px; opacity:.85; }

  /* ---------- Karte ---------- */
  .map-layout { display:grid; grid-template-columns:310px 1fr; gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .map-side { display:flex; flex-direction:column; max-height:720px; }
  .map-ctl { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ctl-label { font-size:11px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 10px; border:1px solid var(--border-strong); border-radius:20px; cursor:pointer; color:var(--text-dim); background:var(--panel); font-weight:700; }
  .chip.active { color:var(--text); border-color:var(--accent); background:var(--accent-bg); }
  .chip:not(.active) .dot { opacity:.35; }
  .range-row { display:flex; flex-direction:column; gap:3px; font-size:12px; font-weight:700; }
  .range-row > span { display:flex; justify-content:space-between; }
  .home-box { display:flex; flex-direction:column; gap:7px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:10px; }
  .home-box .inline { display:flex; gap:6px; }
  .home-box .inline input { flex:1; }
  .home-set { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; }
  .home-set .ico { color:var(--accent); }
  .panel-head { display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1px solid var(--border); font-size:11px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
  .map-list { overflow-y:auto; flex:1; min-height:120px; }
  .map-list-item { display:flex; align-items:center; gap:9px; padding:9px 16px; border-bottom:1px solid var(--border); cursor:pointer; font-size:12.5px; }
  .map-list-item:hover { background:var(--hover); }
  .map-list-item.selected { background:var(--accent-bg); }
  .ml-id { font-weight:800; white-space:nowrap; }
  .ml-loc { color:var(--text-dim); margin-left:auto; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
  .ml-pct { font-weight:800; font-variant-numeric:tabular-nums; font-size:12px; min-width:40px; text-align:right; }
  .map-main { position:relative; }
  .map-canvas { height:720px; width:100%; background:var(--off-bg); }
  .map-error { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-dim); padding:24px; text-align:center; }
  .map-legend { position:absolute; left:14px; bottom:28px; z-index:500; background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-md); padding:11px 14px; font-size:11.5px; max-width:260px; }
  .map-legend b { display:block; font-size:11px; margin-bottom:5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
  .legend-row { display:flex; align-items:center; gap:8px; margin-top:4px; }
  .legend-src { margin-top:8px; padding-top:7px; border-top:1px solid var(--border); color:var(--text-dim); font-size:10.5px; line-height:1.45; }
  .sig-dot { width:9px; height:9px; border-radius:50%; background:#9a928a; border:1.5px solid #2a272d; display:inline-block; }
  .map-route { position:absolute; right:14px; top:14px; z-index:500; width:290px; background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-md); padding:13px 14px; font-size:12.5px; }
  .map-route[hidden] { display:none; }
  .route-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .route-kpi { display:flex; gap:16px; margin:6px 0 10px; }
  .route-kpi b { font-size:18px; font-weight:800; display:block; }
  .route-kpi span { font-size:11px; color:var(--text-dim); }
  .route-stops { margin:0 0 10px; padding-left:18px; max-height:180px; overflow:auto; }
  .route-stops li { margin:3px 0; }
  .pin-icon { background:none; border:none; }
  .pin-icon svg { filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  html[data-theme=dark] .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  .pop { color:#26232a; font-family:var(--font); font-size:12.5px; line-height:1.6; min-width:210px; }
  .pop .btn { margin-top:8px; color:#26232a; background:#fff; border-color:#d8d0c4; }

  /* ---------- Detail ---------- */
  .detail-header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; position:relative; overflow:hidden; }
  .detail-header::before { content:''; position:absolute; left:0; top:0; right:0; height:5px; background:var(--stripes); }
  .detail-id { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .detail-battery { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .big { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .owner-card { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; border-left:5px solid var(--accent); }
  .owner-card.free { border-left-color:var(--crit); background:linear-gradient(90deg, var(--crit-bg), var(--panel) 55%); }
  .owner-card .who { flex:1; min-width:220px; }
  .owner-card .who b { font-size:15px; }
  .owner-card .avatar { width:40px; height:40px; font-size:14px; }
  .detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:14px; }
  .chart-wrap { position:relative; height:280px; }
  .seg { display:flex; gap:3px; background:var(--bg); padding:3px; border-radius:10px; flex-wrap:wrap; }
  .seg button { background:transparent; border:none; color:var(--text-dim); padding:5px 12px; border-radius:8px; font-size:11.5px; cursor:pointer; font-weight:700; }
  .seg button.active { background:var(--panel); color:var(--text); box-shadow:var(--shadow); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px 20px; }
  .kpi span { display:block; font-size:11px; color:var(--text-dim); margin-bottom:3px; font-weight:700; }
  .kpi b { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .kpi b.xl { font-size:28px; }
  .field-inline { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--text-dim); font-weight:700; }
  .mini-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .mini-table th { text-align:left; font-size:11px; color:var(--text-dim); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .mini-table td { padding:8px 10px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; vertical-align:top; }
  .mini-table tr:last-child td { border-bottom:none; }
  .mini-table tr.click { cursor:pointer; }
  .mini-table tr.click:hover td { background:var(--hover); }
  .sub-h { font-size:11px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin:16px 0 6px; }
  .note-box { background:var(--accent-bg); border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.5; }

  /* ---------- Tickets ---------- */
  .tk-title { font-weight:800; }
  .tk-assign { max-width:170px; }

  /* ---------- Historie ---------- */
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto; }
  .tab { background:none; border:none; padding:10px 14px; font-weight:800; font-size:13px; color:var(--text-dim); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap; display:inline-flex; gap:7px; align-items:center; }
  .tab.active { color:var(--text); border-bottom-color:var(--accent); }
  .score { display:flex; align-items:center; gap:8px; }
  .score .bar { width:70px; }
  .badge-rec { display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--ok-bg); color:var(--ok); margin-left:6px; }
  .badge-cheap { background:var(--accent-bg); color:var(--accent-strong); }
  .snap-layout { display:grid; grid-template-columns:280px 1fr; gap:14px; }
  .snap-item { padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; font-size:12.5px; }
  .snap-item:hover { background:var(--hover); }
  .snap-item.selected { background:var(--accent-bg); }
  .delta-up { color:var(--ok); } .delta-down { color:var(--crit); }
  .act-item { display:flex; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); font-size:12.5px; align-items:flex-start; }
  .act-item:last-child { border-bottom:none; }
  .act-item .when { margin-left:auto; color:var(--text-dim); font-size:11.5px; white-space:nowrap; }

  /* ---------- Postfach ---------- */
  .inbox-layout { display:grid; grid-template-columns:minmax(300px, 400px) 1fr; gap:14px; align-items:start; }
  .msg-item { display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); cursor:pointer; align-items:start; }
  .msg-item:hover { background:var(--hover); }
  .msg-item.selected { background:var(--accent-bg); }
  .msg-item.unread .msg-title { font-weight:800; }
  .msg-kind { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--off-bg); color:var(--text-dim); }
  .msg-kind.k-alert { background:var(--crit-bg); color:var(--crit); }
  .msg-kind.k-ticket { background:var(--accent-bg); color:var(--accent-strong); }
  .msg-kind.k-admin, .msg-kind.k-sent { background:var(--ok-bg); color:var(--ok); }
  .msg-title { font-size:13px; font-weight:600; display:flex; gap:6px; align-items:center; }
  .msg-title .udot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
  .msg-snip { font-size:12px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .msg-meta { display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:11px; color:var(--text-dim); white-space:nowrap; }
  .star { background:none; border:none; padding:0; cursor:pointer; color:var(--border-strong); line-height:0; }
  .star.on { color:var(--accent); }
  .star.on .ico { fill:currentColor; }
  .msg-view h2 { font-size:18px; margin:4px 0 6px; }
  .msg-body { font-size:13.5px; line-height:1.6; white-space:pre-wrap; margin:14px 0; }

  /* ---------- Optionen ---------- */
  .settings-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; align-items:start; }
  .switch-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; cursor:pointer; font-weight:600; }
  .switch-row:last-of-type { border-bottom:none; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; font-size:13px; font-weight:700; }
  .field > span { display:flex; justify-content:space-between; gap:10px; }
  .field b { font-variant-numeric:tabular-nums; color:var(--accent-strong); }
  .field small { font-weight:400; font-size:11.5px; color:var(--text-dim); line-height:1.45; }
  .hint { font-size:11.5px; color:var(--text-dim); margin:0 0 12px; line-height:1.5; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .team-list { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
  .team-chip { display:inline-flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--border); border-radius:20px; padding:3px 4px 3px 10px; font-size:12px; font-weight:700; }
  .team-chip button { border:none; background:none; cursor:pointer; color:var(--text-dim); font-size:14px; line-height:1; padding:2px 5px; border-radius:50%; }
  .team-chip button:hover { color:var(--crit); }
  .if-grid { display:grid; grid-template-columns:2fr 1fr; gap:10px; }
  .if-grid .field, .map-grid .field { margin-bottom:0; }
  .map-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; white-space:pre; overflow-x:auto; margin:0; }
  .dummy { display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--warn-bg); color:var(--warn); margin-left:8px; vertical-align:middle; text-transform:uppercase; letter-spacing:.04em; }
  .if-status { display:flex; align-items:center; gap:8px; font-size:12px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; margin-bottom:14px; }

  footer.note { margin-top:32px; padding-top:16px; border-top:1px solid var(--border); color:var(--text-dim); font-size:11.5px; line-height:1.6; }
  footer.note a { color:inherit; }

  /* ---------- Modal & Toast ---------- */
  .modal-backdrop { position:fixed; inset:0; z-index:2500; background:rgba(20,18,22,.55); display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px 20px; overflow-y:auto; }
  .modal { background:var(--panel); border-radius:16px; width:100%; max-width:560px; box-shadow:var(--shadow-md); overflow:hidden; animation:pop .15s ease; }
  .modal.wide { max-width:720px; }
  .modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px 20px 12px; border-bottom:1px solid var(--border); position:relative; }
  .modal-head::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--stripes); }
  .modal-head h2 { margin:4px 0 0; font-size:17px; font-weight:800; }
  .modal-body { padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
  .modal-foot { padding:12px 20px 16px; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; border-top:1px solid var(--border); }
  .modal .field { margin-bottom:0; }
  .modal .row2 { gap:12px; }
  .x { background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--text-dim); padding:2px 6px; }
  .comments { display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
  .comment { background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:8px 11px; font-size:12.5px; }
  .comment .meta { font-size:11px; color:var(--text-dim); margin-bottom:2px; font-weight:700; }
  @keyframes pop { from { transform:translateY(8px); opacity:0; } }
  .toasts { position:fixed; right:20px; bottom:20px; z-index:2800; display:flex; flex-direction:column; gap:8px; max-width:360px; }
  .toast { background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:12px; box-shadow:var(--shadow-md); padding:11px 14px; font-size:12.5px; cursor:pointer; animation:pop .2s ease; }
  .toast.crit { border-left-color:var(--crit); } .toast.warn { border-left-color:var(--warn); } .toast.ok { border-left-color:var(--ok); }

  /* ---------- Handy (automatisch erkannt) ---------- */
  [data-layout=mobile] .app { display:flex; flex-direction:column; }
  [data-layout=mobile] .main { order:1; flex:1; padding:16px 14px 28px; }
  [data-layout=mobile] .sidebar { order:2; position:sticky; bottom:0; top:auto; height:auto; z-index:1000; padding-bottom:env(safe-area-inset-bottom); }
  [data-layout=mobile] .brand, [data-layout=mobile] .side-foot, [data-layout=mobile] .sidebar > .stripes { display:none; }
  [data-layout=mobile] .nav { flex-direction:row; padding:6px; gap:2px; overflow-x:auto; scrollbar-width:none; }
  [data-layout=mobile] .nav-item { flex:1 0 64px; flex-direction:column; gap:3px; justify-content:center; text-align:center; font-size:10.5px; padding:7px 2px; }
  [data-layout=mobile] .nav-item.active::before { left:22%; right:22%; top:-6px; bottom:auto; width:auto; height:3px; border-radius:0 0 3px 3px; }
  [data-layout=mobile] .nav-item .badge { position:absolute; top:2px; right:8px; font-size:9.5px; padding:0 5px; }
  [data-layout=mobile] .mobile-head { display:flex; }
  [data-layout=mobile] .topbar { flex-direction:column; align-items:stretch; margin-bottom:16px; }
  [data-layout=mobile] .page-title { font-size:20px; }
  [data-layout=mobile] .summary-strip { grid-template-columns:repeat(2,1fr); }
  [data-layout=mobile] .summary-hint, [data-layout=mobile] .hide-m { display:none !important; }
  [data-layout=mobile] .filter-bar > * { flex:1 1 140px; }
  [data-layout=mobile] .alert { grid-template-columns:auto auto 1fr; row-gap:6px; }
  [data-layout=mobile] .alert > :nth-child(n+4) { grid-column:2 / 4; justify-self:start; }
  [data-layout=mobile] .device-table td, [data-layout=mobile] .device-table th { padding:10px 8px; }
  [data-layout=mobile] .bar { width:44px; }
  [data-layout=mobile] tr.expand td { padding:4px 12px 16px; }
  [data-layout=mobile] .map-layout, [data-layout=mobile] .settings-grid, [data-layout=mobile] .grid2,
  [data-layout=mobile] .snap-layout, [data-layout=mobile] .inbox-layout, [data-layout=mobile] .if-grid, [data-layout=mobile] .map-grid { grid-template-columns:1fr; }
  [data-layout=mobile] .map-side { max-height:none; }
  [data-layout=mobile] .map-list { max-height:280px; }
  [data-layout=mobile] .map-canvas { height:440px; }
  [data-layout=mobile] .map-main { order:-1; }
  [data-layout=mobile] .map-route { left:10px; right:10px; width:auto; top:10px; }
  [data-layout=mobile] .map-legend { bottom:22px; left:10px; max-width:200px; }
  [data-layout=mobile] .inbox-layout.has-sel .ib-list-wrap { display:none; }
  [data-layout=mobile] .inbox-layout:not(.has-sel) .ib-view-wrap { display:none; }
  [data-layout=mobile] .toasts { left:12px; right:12px; bottom:80px; max-width:none; }
  [data-layout=mobile] .modal-backdrop { padding:0; align-items:flex-end; }
  [data-layout=mobile] .modal { border-radius:18px 18px 0 0; max-height:92vh; overflow-y:auto; }
  [data-layout=mobile] .modal .row2 { grid-template-columns:1fr; }
  .mobile-head { display:none; align-items:center; justify-content:space-between; gap:10px; margin:-4px 0 14px; }
  .mobile-head .brand-m { display:flex; align-items:center; gap:9px; background:none; border:none; padding:0; cursor:pointer; }
  .mobile-head .brand-name { color:var(--text); }
  .back-m { display:none; }
  [data-layout=mobile] .back-m { display:inline-flex; }

  /* ---------- Durchsuchbare Auswahl (Combobox) ---------- */
  .combo { position:relative; min-width:0; }
  .combo-in { width:100%; }
  .combo-mount { flex:0 1 210px; min-width:150px; }
  .combo-list { position:fixed; z-index:2900; max-height:280px; overflow-y:auto; background:var(--panel); border:1px solid var(--border-strong); border-radius:10px; box-shadow:var(--shadow-md); padding:4px; }
  .combo-list[hidden] { display:none; }
  .combo-opt { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:7px; cursor:pointer; font-size:12.5px; }
  .combo-opt .ico { width:15px; height:15px; color:var(--accent-strong); }
  .combo-opt.active, .combo-opt:hover { background:var(--accent-bg); }
  .combo-opt .sub { margin:0 0 0 auto; padding-left:10px; white-space:nowrap; }
  .combo-opt.sel { font-weight:800; }
  .combo-empty { padding:8px 10px; font-size:12px; color:var(--text-dim); }

  /* ---------- Meldungen, Zuständigkeit, Abfrage ---------- */
  .alert .a-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .alerts-foot { padding:9px 16px; font-size:12px; color:var(--text-dim); border-top:1px solid var(--border); background:var(--panel-2); }
  .tag.ok { background:var(--ok-bg); color:var(--ok); }
  .tag.dim { background:var(--off-bg); color:var(--text-dim); }
  .s-verifying { color:var(--accent-strong); background:var(--accent-bg); }
  .act { text-align:right; white-space:nowrap; width:1%; }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .icon-btn { background:none; border:1px solid transparent; border-radius:8px; padding:5px 6px; cursor:pointer; color:var(--text-dim); line-height:0; }
  .icon-btn:hover { border-color:var(--border-strong); color:var(--accent-strong); background:var(--panel); }
  .icon-btn[disabled] { opacity:.7; pointer-events:none; }
  .icon-btn .ico { width:16px; height:16px; }
  .resp-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .resp { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; border-left:5px solid var(--accent); }
  .resp.free { border-left-color:var(--crit); background:linear-gradient(90deg, var(--crit-bg), var(--panel) 60%); }
  .resp .who { flex:1; min-width:180px; }
  .resp .who b { font-size:14.5px; }
  .resp .avatar { width:40px; height:40px; font-size:14px; }
  .resp .ctrl { display:flex; gap:8px; flex-wrap:wrap; width:100%; align-items:center; }
  .overdue { color:var(--crit); font-weight:800; }
  .owner-name { font-weight:700; }
  .day-nav { display:flex; gap:6px; align-items:center; }
  .msg-kind.k-resolved { background:var(--ok-bg); color:var(--ok); }
  .msg-kind.k-closed { background:var(--off-bg); color:var(--text-dim); }
  #ov-polled { white-space:nowrap; }
  [data-layout=mobile] .resp-grid { grid-template-columns:1fr; }
  [data-layout=mobile] .combo-mount { flex:1 1 140px; }

  /* ---------- Geräte-Gesamtübersicht ---------- */
  .dev-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(255px, 1fr)); gap:12px; }
  .dev-card { background:var(--panel); border:1px solid var(--border); border-left:5px solid var(--ok); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:9px; transition:border-color .15s, transform .15s; }
  .dev-card:hover { border-color:var(--accent); border-left-color:inherit; transform:translateY(-1px); }
  .dev-card.st-crit { border-left-color:var(--crit); } .dev-card.st-offline { border-left-color:var(--off); }
  .dev-card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .dc-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .dc-id { font-weight:800; font-size:15.5px; letter-spacing:-.01em; }
  .dc-name { font-size:12.5px; color:var(--text-dim); margin-top:-4px; }
  .dc-batt { display:flex; align-items:center; gap:10px; }
  .dc-batt .bar { flex:1; width:auto; height:9px; }
  .dc-batt b { font-size:19px; font-weight:800; min-width:56px; text-align:right; font-variant-numeric:tabular-nums; }
  .dc-meta { display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--text-dim); align-items:center; }
  .dc-meta span { display:inline-flex; align-items:center; gap:4px; }
  .dc-meta .ico { width:13px; height:13px; }
  .dc-foot { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11.5px; min-height:24px; }
  .dc-foot .tag { padding:2px 8px; font-size:11px; }
  .dl-chips { display:flex; gap:6px; flex-wrap:wrap; }
  [data-layout=mobile] .dev-grid { grid-template-columns:1fr; }
</style>
</head>
<body>

<!-- ============ Anmeldung ============ -->
<div class="login" id="login" hidden>
  <div class="login-card" id="login-card">
    <div id="login-logo"></div>
    <h1>Battery Bandits</h1>
    <p data-i18n="login.sub"></p>
    <div class="stripes"></div>
    <form id="login-form" autocomplete="off">
      <label for="login-pw" data-i18n="login.pw"></label>
      <input type="password" id="login-pw" autocomplete="current-password">
      <div class="login-error" id="login-error"></div>
      <button class="btn btn-primary" type="submit" style="justify-content:center;padding:11px" data-i18n="login.btn"></button>
      <div class="login-hint" id="login-hint" data-i18n="login.hint"></div>
    </form>
  </div>
</div>

<!-- ============ App ============ -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <button class="brand" data-action="nav" data-page="overview" id="brand"></button>
    <div class="stripes"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-user" id="side-user"></div>
      <div class="sync" id="sync"></div>
      <button class="side-btn" data-action="contact-admin" id="side-admin"></button>
      <button class="side-btn" data-action="logout" id="side-logout"></button>
    </div>
  </aside>

  <main class="main">
    <div class="mobile-head" id="mobile-head"></div>

    <!-- ÜBERSICHT -->
    <section class="page active" id="page-overview">
      <div class="topbar">
        <div><h1 class="page-title" data-i18n="ov.title"></h1><div class="page-sub" data-i18n="ov.sub"></div></div>
        <div class="topbar-actions"><span class="sub" id="ov-polled"></span><button class="btn" data-action="poll-all" id="btn-poll-all"></button></div>
      </div>
      <div class="summary-strip" id="ov-summary"></div>
      <div id="ov-alerts"></div>
      <div class="filter-bar">
        <input id="ov-search" type="search" data-i18n-ph="search.ph">
        <div id="ov-city-mount" class="combo-mount"></div>
        <div id="ov-owner-mount" class="combo-mount"></div>
        <select id="ov-status"></select>
        <select id="ov-sort"></select>
        <label class="check"><input type="checkbox" id="ov-mine"><span data-i18n="ov.mine"></span></label>
        <button class="btn btn-ghost" data-action="reset-filters" data-i18n="btn.reset"></button>

const COMBOS = {};

}

function setCombo(id, value, options) {
  const c = COMBOS[id]; if (!c) return;

  $$(`[data-combo="${id}"]`).forEach(inp => { if (inp !== document.activeElement) inp.value = comboLabel(id); });
}

  const q = norm(c.query.trim());
  const list = c.options.filter(o => !q || norm(`${o.l} ${o.sub || ''} ${o.k || ''}`).includes(q));
  if (c.all !== null && !q) list.unshift({ v: '', l: c.all });
  if (c.allowNew && q && !c.options.some(o => norm(o.l) === q)) list.push({ v: c.query.trim(), l: t('combo.new', { v: c.query.trim() }), isNew: true });
  return list;
}

  const c = COMBOS[inp.dataset.combo], box = inp.nextElementSibling; if (!c || !box) return;
  c.items = comboItems(c);
  box.innerHTML = c.items.length ? c.items.map((o, i) => `<div class="combo-opt ${i === c.active ? 'active' : ''} ${!o.isNew && o.v === c.value ? 'sel' : ''}" data-i="${i}" role="option">${o.isNew ? icon('plus') : o.dot ? `<span class="dot l-${o.dot}"></span>` : ''}<span>${esc(o.l)}</span>${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}</div>`).join('')
    : `<div class="combo-empty">${t('combo.none')}</div>`;
  box.hidden = false; inp.setAttribute('aria-expanded', 'true'); comboOpenEl = inp; comboPlace(inp);
  box.querySelector('.combo-opt.active')?.scrollIntoView({ block: 'nearest' });
}
function comboPlace(inp) {
  const box = inp.nextElementSibling, r = inp.getBoundingClientRect(), w = Math.max(r.width, 230);
  box.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px'; box.style.width = w + 'px';
  if (innerHeight - r.bottom < 250 && r.top > 250) { box.style.top = 'auto'; box.style.bottom = (innerHeight - r.top + 4) + 'px'; }
  else { box.style.bottom = 'auto'; box.style.top = (r.bottom + 4) + 'px'; }
}

  if (!inp) return;
  const box = inp.nextElementSibling; if (box) box.hidden = true;
  inp.setAttribute('aria-expanded', 'false');

/* ---------- Echte Ampeln aus OpenStreetMap (Overpass-API) ---------- */
const SIG = { state: 'idle', nodes: [], at: 0, snap: {} };
const SIG_KEY = 'bb-signals-v1';
async function loadSignals(force) {
  const cached = store.get(SIG_KEY, null);
  if (cached?.nodes?.length) applySignals(cached, true);
  if (!force && cached && Date.now() - cached.at < CONFIG.SIGNAL_REFRESH_MS) return;
  SIG.state = SIG.nodes.length ? 'ok' : 'loading'; renderSigStatus();
  try {
    const q = `[out:json][timeout:25];node[highway=traffic_signals](${CONFIG.SIGNAL_BBOX.join(',')});out;`;
    const res = await fetch(CONFIG.OVERPASS_URL, { method: 'POST', body: 'data=' + encodeURIComponent(q),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: AbortSignal.timeout(35000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const data = { at: Date.now(), nodes: j.elements.filter(e => e.type === 'node').map(e => [e.id, +e.lat.toFixed(6), +e.lon.toFixed(6)]) };
    if (!data.nodes.length) throw new Error('no nodes');
    store.set(SIG_KEY, data);

  }
}
function applySignals(data, fromCache) {

  // jedem Gerät die nächstgelegene, noch freie echte Ampel zuordnen
  const taken = new Set(); SIG.snap = {};
  SEED.forEach(([id, , , , , lat, lng]) => {
    let best = null, bd = Infinity;
    for (const n of SIG.nodes) { if (taken.has(n[0])) continue; const dd = haversine({ lat, lng }, { lat: n[1], lng: n[2] }); if (dd < bd) { bd = dd; best = n; } }
    if (best && bd <= CONFIG.SIGNAL_MAX_SNAP_KM) { taken.add(best[0]); SIG.snap[id] = { osm: best[0], lat: best[1], lng: best[2] }; }
  });
  if (!devices.length) return;
  rebuildDevices();
  MapView.impl?.setSignals(UI.map.showSignals ? SIG.nodes : []);
  if (!fromCache && UI.page === 'map' && !UI.route) MapView.impl?.fit(mapDevices());

}
function renderSigStatus() { if (UI.page === 'map') renderMap(); }
const sigStatusText = () => SIG.state === 'ok' ? t('sig.ok', { n: fmtNum(SIG.nodes.length), when: fmtDateTime(SIG.at) }) : SIG.state === 'error' ? t('sig.error') : t('sig.loading');

function pickModel(r, ts, cur) {
  const avail = MODELS.filter(m => new Date(m.since).getTime() <= ts);
  if (avail.some(m => m.id === cur) && r() < .45) return MODEL[cur];
  return avail[Math.floor(r() * avail.length)];
}
function buildDevice(row, i) {

  const snap = SIG.snap[id];

  const r = rng(1000 + i * 77), actTs = new Date(act + 'T09:00:00').getTime();

  const dropPct = sc.drop?.pct || 0;

  // aktuelle Batterie: so verankert, dass der Ladestand zum Startzeitpunkt "end" ist
  const cm = MODEL[curModel];
  let rate = rateOf(load, cm), sP = 97 + r() * 3;
  let start = anchor - (sP - dropPct - end) / rate * D;
  if (start < actTs) { start = actTs; sP = Math.min(100, end + dropPct + rate * (anchor - actTs) / D); rate = (sP - dropPct - end) / ((anchor - actTs) / D); }
  const segs = [{ model: cm.id, start, startPct: sP, rate, by: GEN_TEAM[i % 3], dropAt: sc.drop ? lastT0 - sc.drop.h * H : null, dropPct }];

  // frühere Batterien rückwärts bis zur Inbetriebnahme erzeugen

    const m = pickModel(r, swapAt - 30 * D, curModel), rt = rateOf(load, m) * (0.9 + r() * 0.2);
    const ranEmpty = r() < m.empty, endP = ranEmpty ? 0 : 4 + r() * 14;
    const down = ranEmpty ? 0.4 + r() * 2.6 : 0, emptyAt = swapAt - down * D;
    const p0 = 97 + r() * 3;

    if (s <= actTs) s = actTs;
    const seg = { model: m.id, start: s, startPct: p0, rate: rt, by: GEN_TEAM[(i + k + 1) % 3], end: swapAt, emptyAt: ranEmpty ? emptyAt : null };
    seg.endPct = Math.max(0, p0 - rt * ((ranEmpty ? emptyAt : swapAt) - s) / D);

    idx: i, id, street, plz, district, city, lat, lng, osm: snap?.osm ?? null, load, segs,

    serial: `BB-${act.slice(2, 4)}-${4100 + i * 37}`, rssi: -(68 + Math.round(r() * 40)), lag: (1 + (i * 7) % 24) * MIN, polledAt: POLLED[id] || 0
  };

  SH.swaps.filter(s => s.deviceId === id).sort((a, b) => a.t - b.t).forEach(s => {
    const cur = last(d.segs);
    if (s.t <= cur.start) return;

    if (d.deadAt && s.t > d.deadAt - D) { if (s.t > d.deadAt) d.gap = { from: d.deadAt, to: s.t }; d.deadAt = null; }

function segValue(s, ts) { return Math.max(0, s.startPct - s.rate * (ts - s.start) / D - (s.dropAt && ts >= s.dropAt ? s.dropPct : 0)); }

let devices = [];

const byId = id => devices.find(d => d.id === id);

/* ---------- Datenschnittstelle ----------
   Hier wird später die echte Quelle angebunden (MQTT-Subscription bzw. REST-Polling).

const DataSource = {
  timer: null, lastPoll: Date.now(), busy: new Set(),
  // Regelabfrage im eingestellten Intervall
  poll() {
    devices.forEach(d => d.history = readings(d));
    this.lastPoll = Date.now();
    dailyClose(); syncIncidents(); refresh();
  },
  // Einzelabfrage: sendet sofort eine Anfrage an ein Gerät, ohne auf das Intervall zu warten.
  // TODO echte Anbindung: z. B. MQTT-Request auf `${SH.iface.path}/request` bzw. GET `${SH.iface.host}/devices/{id}`
  pollDevice(id, { quiet = false, sync = true } = {}) {
    this.busy.add(id); renderBusy();
    return new Promise(res => setTimeout(() => {
      this.busy.delete(id);
      const d = byId(id), alive = !d.deadAt;
      if (alive) d.polledAt = POLLED[id] = Date.now();
      d.history = readings(d);
      if (sync) syncIncidents();
      refresh(); renderBusy();
      if (!quiet) toast(alive ? t('poll.ok', { id, v: fmtNum(last(d).pct, 1) }) : t('poll.noAnswer', { id }), alive ? 'ok' : 'warn');
      res({ alive, d });

  },

    const rs = await Promise.all(devices.map(d => this.pollDevice(d.id, { quiet: true, sync: false })));
    this.lastPoll = Date.now(); syncIncidents(); refresh();

  },
  start() { clearInterval(this.timer); this.timer = setInterval(() => this.poll(), clamp(+SH.iface.interval || 30, 5, 3600) * 1000); },
  label() { return SH.iface.type === 'sim' ? t('if.t.sim') : `${t('if.t.' + SH.iface.type)} (${t('if.dummy')})`; }
};
function pollBtn(id, label) {
  const busy = DataSource.busy.has(id);

}
function renderBusy() {
  $$('[data-action=poll-device]').forEach(b => { const busy = DataSource.busy.has(b.dataset.id); b.disabled = busy; b.innerHTML = (busy ? '<span class="spin"></span>' : icon('refresh')) + (b.dataset.label ? t('btn.poll') : ''); });
  const pa = $('#btn-poll-all'); if (pa) { pa.disabled = DataSource.busy.size > 0; pa.innerHTML = (DataSource.busy.size ? '<span class="spin"></span>' : icon('refresh')) + t('btn.pollAll'); }
}

/* Wechsel aller Geräte als Liste */
function swapsOf(d) {
  return d.segs.slice(1).map((seg, k) => {
    const prev = d.segs[k];
    return { t: seg.start, device: d, oldModel: prev.model, newModel: seg.model, by: seg.by, manual: !!seg.manual,
      runtime: (seg.start - prev.start) / D, endPct: prev.endPct ?? 0,
      down: prev.emptyAt ? (seg.start - prev.emptyAt) / D : 0, cost: MODEL[seg.model].price + CONFIG.SERVICE_COST };
  });
}
const allSwaps = () => devices.flatMap(swapsOf).sort((a, b) => b.t - a.t);

/* Kosten-Nutzen-Analyse je Batteriemodell */
function modelStats() {
  const acc = Object.fromEntries(MODELS.map(m => [m.id, { m, n: 0, active: 0, days: 0, norm: 0, empties: 0, down: 0 }]));
  devices.forEach(d => d.segs.forEach((s, j) => {
    const a = acc[s.model];
    if (j === d.segs.length - 1) { a.active++; return; }
    const opDays = ((s.emptyAt ?? s.end) - s.start) / D;
    if (opDays < 3 || (s.endPct ?? 0) > 30) return; // vorzeitig gewechselte Batterien verzerren die Laufzeit
    a.n++; a.days += opDays; a.norm += opDays * d.load / CONFIG.REF_LOAD;
    if (s.emptyAt) { a.empties++; a.down += (s.end - s.emptyAt) / D; }
  }));
  const list = Object.values(acc).map(a => {
    const avgDays = a.n ? a.days / a.n : null, avgNorm = a.n ? a.norm / a.n : null, total = a.m.price + CONFIG.SERVICE_COST;
    return { ...a, avgDays, avgNorm, emptyShare: a.n ? a.empties / a.n : null,
      mat: avgNorm ? a.m.price / avgNorm : null, tot: avgNorm ? total / avgNorm : null, factor: avgNorm ? avgNorm / total * 100 : null };
  });
  const best = Math.max(...list.map(x => x.factor || 0)), cheapest = Math.min(...list.filter(x => x.mat).map(x => x.mat));
  list.forEach(x => { x.score = x.factor ? x.factor / best : 0; x.isBest = !!x.factor && x.factor === best; x.isCheap = x.mat === cheapest; });
  return list;
}

/* =====================================================================
   ZUSTÄNDE & NOTMELDUNGEN
   ===================================================================== */
const TH = () => SH.th;
function statusOf(d) { const l = last(d); if (Date.now() - l.t > TH().offlineHours * H) return 'offline'; return l.pct < TH().critical ? 'crit' : 'ok'; }
function lightOf(d) { if (statusOf(d) === 'offline') return 'offline'; const p = last(d).pct; return p < TH().critical ? 'red' : p < TH().warn ? 'yellow' : 'green'; }
const pill = st => `<span class="pill s-${st}"><span class="dot"></span>${t('status.' + st)}</span>`;
const pctLabel = d => `${fmtNum(Math.round(last(d).pct))} %`;

/* Bedingungen aus den Messdaten (was das System erkennt) */
function deviceAlerts(d) {
  const h = d.history, l = last(d), st = statusOf(d), th = TH(), out = [], segStart = curSeg(d).start;
  if (st === 'crit') { let i = h.length - 1; while (i > 0 && h[i - 1].pct < th.critical) i--; out.push({ type: 'threshold', sev: 'high', t: h[i].t, v: l.pct }); }
  if (st === 'offline') out.push(l.pct >= th.offlineAnomalyMin ? { type: 'offlineHigh', sev: 'high', t: l.t, v: l.pct } : { type: 'offline', sev: 'med', t: l.t, v: l.pct, h: (Date.now() - l.t) / H });

    let i = h.length - 1; while (i > 0 && h[i - 1].t >= lim && Math.abs(h[i - 1].pct - l.pct) < .05) i--;

  }
  for (let i = h.length - 1; i > 0 && h[i].t > Date.now() - 2 * D; i--) {
    if (h[i].t > segStart && h[i].t > (d.dropAck || 0) && h[i - 1].pct - h[i].pct >= th.dropPct) { out.push({ type: 'drop', sev: 'med', t: h[i].t, from: h[i - 1].pct, to: h[i].pct }); break; }
  }

}
function alertMsg(a) {
  switch (a.type) {
    case 'threshold': return t('alert.threshold', { v: fmtNum(a.v ?? 0), th: TH().critical });
    case 'offlineHigh': return t('alert.offlineHigh', { v: fmtNum(a.v ?? 0) });
    case 'offline': return t('alert.offline', { h: fmtNum(a.h ?? 0), v: fmtNum(a.v ?? 0) });
    case 'stagnant': return t('alert.stagnant', { d: fmtNum(a.days ?? 0, 1) });

}
const ALERT_TICKET = { threshold: ['swap', 'high'], offlineHigh: ['check', 'high'], offline: ['swap', 'med'], stagnant: ['sensor', 'med'], drop: ['check', 'med'] };
const FIX_KIND = { offlineHigh: 'offline', offline: 'offline', stagnant: 'sensor', drop: 'drop' };
const strip = a => ({ v: a.v, days: a.days, from: a.from, to: a.to, h: a.h, t: a.t });

/* Meldungen (geteilt): open → Entscheidung durch einen Menschen → ticket | dismissed → resolved (per Abfrage bestätigt)

let LIVE = new Map(), ALERTS = [];
const incMsg = inc => alertMsg(LIVE.get(inc.key) || { ...inc.data, type: inc.type });
const incOf = deviceId => Object.values(SH.incidents).filter(x => x.deviceId === deviceId).sort((a, b) => b.firstSeen - a.firstSeen);

function matchLive() {
  const map = new Map(), unmatched = [], incs = Object.values(SH.incidents);
  devices.flatMap(deviceAlerts).forEach(a => {
    const inc = incs.filter(x => x.deviceId === a.id && x.type === a.type && !x.clearedAt).sort((x, y) => y.created - x.created)[0];
    inc ? map.set(inc.key, a) : unmatched.push(a);

}
function computeLive() { LIVE = matchLive().map; ALERTS = openIncidents(); }
function syncIncidents() {
  const now = Date.now(), { map, unmatched } = matchLive();
  let changed = false;
  unmatched.forEach(a => {
    const key = `${a.id}:${a.type}:${(now + Math.floor(Math.random() * 1e6)).toString(36)}`;
    const tk = SH.tickets.find(x => x.deviceId === a.id && x.status !== 'done' && !x.incident && x.type === ALERT_TICKET[a.type][0]);
    SH.incidents[key] = { key, deviceId: a.id, type: a.type, sev: a.sev, firstSeen: a.t, created: now, data: strip(a), notified: [],
      status: tk ? 'ticket' : 'open', ticketId: tk?.id || null, decidedBy: tk?.createdBy || null, decidedAt: tk?.created || null };
    if (tk) tk.incident = key;
    map.set(key, a); changed = true;
  });
  Object.values(SH.incidents).forEach(inc => {
    if (inc.clearedAt || map.has(inc.key)) return;
    inc.clearedAt = now; changed = true;
    if (inc.status !== 'open' && inc.status !== 'ticket') return;
    const fx = [...SH.swaps, ...SH.fixes].filter(x => x.deviceId === inc.deviceId && x.t >= inc.firstSeen - H).sort((a, b) => b.t - a.t)[0];
    Object.assign(inc, { status: 'resolved', resolvedAt: now, resolvedBy: fx ? fx.by : t('system'), auto: !fx, verifiedPct: last(byId(inc.deviceId)).pct });
    logAct(fx ? 'incident_resolved' : 'incident_auto', { device: inc.deviceId }, fx ? fx.by : t('system'));
    const tk = inc.ticketId && ticketById(inc.ticketId);
    if (tk && tk.status !== 'done') tk.comments.push({ by: t('system'), t: now, text: t('ver.comment.auto') });
  });

}

/* =====================================================================
   POSTFACH
   ===================================================================== */
function inScope(deviceId) {
  if (!S.me || S.notify.scope === 'all') return true;
  const o = SH.owners[deviceId];
  return o === S.me || (S.notify.scope === 'mineFree' && !o);
}
/* Postfach mit den geteilten Meldungen abgleichen: neue Meldungen ankündigen,
   Statuswechsel (Ticket, geschlossen, behoben) an alle melden, die die Meldung bekommen haben */
function syncInbox() {
  if (!devices.length) return;
  reloadLocal();
  const fresh = []; let sharedChanged = false;
  Object.values(SH.incidents).forEach(inc => {
    const prev = LOC.incSeen[inc.key];
    if (prev === inc.status) return;
    LOC.incSeen[inc.key] = inc.status;
    const d = byId(inc.deviceId); if (!d) return;
    const msg = incMsg(inc);
    if (prev === undefined) {
      if (!['open', 'ticket'].includes(inc.status) || !inScope(inc.deviceId) || S.notify.types[inc.type] === false) return;
      fresh.push(addMsg({ kind: 'alert', incident: inc.key, state: inc.status, title: `${inc.deviceId}: ${msg}`, deviceId: inc.deviceId, sev: inc.sev, t: inc.firstSeen,
        body: `${msg}\n\n${d.street}, ${d.plz} ${d.city}\n${SH.owners[inc.deviceId] ? t('inc.owner', { name: SH.owners[inc.deviceId] }) : t('inc.noOwner')}` }, false));
      if (S.me && !inc.notified.includes(S.me)) { inc.notified.push(S.me); sharedChanged = true; }
      return;
    }
    const mine = LOC.inbox.filter(m => m.incident === inc.key && m.kind === 'alert');
    if (!mine.length) return;
    mine.forEach(m => m.state = inc.status);
    const by = inc.status === 'resolved' ? inc.resolvedBy : inc.decidedBy, announce = by !== S.me;
    let m = null;
    if (inc.status === 'ticket') {
      const tk = ticketById(inc.ticketId);
      m = { kind: 'ticket', ticketId: inc.ticketId, title: t('msg.ticketed.t', { id: inc.deviceId, ticket: inc.ticketId }),
        body: t('msg.ticketed.b', { by, msg, ticket: inc.ticketId, to: tk?.assignee || t('tk.unassigned'), due: tk?.due ? fmtDate(keyDate(tk.due)) : '–' }) };
    } else if (inc.status === 'dismissed') {
      m = { kind: 'closed', title: t('msg.dismissed.t', { id: inc.deviceId }), body: t('msg.dismissed.b', { by, msg, reason: t('inc.r.' + inc.reason), note: inc.note ? `\n${inc.note}` : '' }) };
    } else if (inc.status === 'resolved') {
      m = inc.auto ? { kind: 'resolved', title: t('msg.autoRes.t', { id: inc.deviceId, msg }), body: t('msg.autoRes.b', { when: fmtDateTime(inc.resolvedAt) }) }
        : { kind: 'resolved', title: t('msg.resolved.t', { id: inc.deviceId, msg }), body: t('msg.resolved.b', { by, when: fmtDateTime(inc.resolvedAt), v: fmtNum(inc.verifiedPct ?? 0) }) };
    }
    if (m) addMsg({ ...m, deviceId: inc.deviceId, incident: inc.key, read: !announce }, announce);
  });
  if (fresh.length === 1) notifyOut(esc(fresh[0].title), fresh[0].sev === 'high' ? 'crit' : 'warn', 'msg:' + fresh[0].id);
  else if (fresh.length > 1) notifyOut(t('msg.newAlerts', { n: fresh.length }), 'crit', 'inbox');
  saveLocal(); renderBadges();
  if (sharedChanged) saveShared();
}
function addMsg(m, announce = true) {
  const msg = { id: uid('m'), t: Date.now(), read: false, flagged: false, ...m };
  LOC.inbox.unshift(msg); LOC.inbox = LOC.inbox.slice(0, 300); saveLocal();
  if (announce) notifyOut(esc(msg.title), msg.kind === 'alert' ? (msg.sev === 'high' ? 'crit' : 'warn') : msg.kind === 'resolved' ? 'ok' : '', 'msg:' + msg.id);
  renderBadges();
  return msg;
}
function notifyOut(html, kind, target) {

  if (S.notify.browser && 'Notification' in window && Notification.permission === 'granted') new Notification('Battery Bandits', { body: html.replace(/<[^>]+>/g, '') });
  if (S.notify.email && S.notify.emailAddr && kind) toast(t('toast.email', { to: esc(S.notify.emailAddr) }), 'ok');
}
function diffTicketsForInbox(before, after) {
  if (!S.notify.types.ticket || !S.me) return;
  const old = Object.fromEntries((before || []).map(x => [x.id, x]));
  after.forEach(tk => {
    const o = old[tk.id];
    if (tk.updatedBy === S.me) return;
    if (tk.assignee === S.me && (!o || o.assignee !== S.me))
      addMsg({ kind: 'ticket', title: t('msg.assigned.t', { ticket: tk.id }), body: t('msg.assigned.b', { by: tk.updatedBy, title: tk.title, device: tk.deviceId }), ticketId: tk.id, deviceId: tk.deviceId });
    else if (o && o.status !== tk.status && (tk.assignee === S.me || tk.createdBy === S.me))
      addMsg({ kind: 'ticket', title: t('msg.status.t', { ticket: tk.id, status: t('tk.' + tk.status) }), body: t('msg.status.b', { by: tk.updatedBy, title: tk.title, status: t('tk.' + tk.status) }), ticketId: tk.id, deviceId: tk.deviceId });
  });
}

/* „Behoben melden“: Gerät sofort abfragen und nur bei bestätigter Behebung schließen */
function reportFixed(ticketId) {
  withName(async () => {
    const tk = ticketById(ticketId); if (!tk || UI.verifying.has(ticketId)) return;
    const d0 = byId(tk.deviceId), inc = tk.incident && SH.incidents[tk.incident];
    UI.verifying.add(ticketId); refresh(); refreshModal();
    toast(t('ver.running', { id: d0.id }));
    // Simulation: der Feldeinsatz wird nachgebildet, damit das simulierte Gerät den neuen Zustand liefert.
    // Im Echtbetrieb entfällt dieser Schritt – die Abfrage liefert den tatsächlichen Zustand.
    const kinds = new Set([FIX_KIND[inc?.type], statusOf(d0) === 'offline' ? 'offline' : null, tk.type === 'sensor' ? 'sensor' : null].filter(Boolean));
    if (kinds.size) { kinds.forEach(k => SH.fixes.push({ deviceId: d0.id, kind: k, t: Date.now(), by: me() })); rebuildDevices(); }
    const r = await DataSource.pollDevice(d0.id, { quiet: true, sync: false });
    UI.verifying.delete(ticketId);
    const d = byId(d0.id), now = Date.now();
    const types = inc ? [inc.type] : Object.keys(ALERT_TICKET).filter(k => ALERT_TICKET[k][0] === tk.type);
    const still = !r.alive ? { type: 'offline' } : deviceAlerts(d).find(a => types.includes(a.type));
    if (still) {
      const reason = t('ver.r.' + still.type, { v: fmtNum(last(d).pct) });
      tk.comments.push({ by: t('system'), t: now, text: t('ver.comment.fail', { reason }) });
      Object.assign(tk, { status: 'progress', updated: now, updatedBy: me() });
      logAct('verify_fail', { device: d.id, ticket: ticketId, reason });
      saveShared(); syncIncidents(); refresh(); refreshModal();
      toast(t('ver.fail', { reason }), 'warn');
      return;
    }
    tk.comments.push({ by: t('system'), t: now, text: t('ver.comment.ok', { v: fmtNum(last(d).pct) }) });
    Object.assign(tk, { status: 'done', updated: now, updatedBy: me() });
    logAct('ticket_status', { ticket: ticketId, device: d.id, status: 'done' });
    Object.values(SH.incidents).filter(x => x.deviceId === d.id && (x.ticketId === ticketId || x.key === tk.incident) && x.status !== 'dismissed').forEach(x => {
      if (x.status !== 'resolved' || x.auto) { Object.assign(x, { status: 'resolved', auto: false, resolvedBy: me(), resolvedAt: now, verifiedPct: last(d).pct }); logAct('incident_resolved', { device: d.id }); }
    });
    saveShared(); syncIncidents(); refresh(); refreshModal();
    toast(t('ver.ok', { id: d.id }), 'ok');
  });
}

function toast(html, kind = '', target = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.innerHTML = html;
  if (target) { el.dataset.action = 'toast-open'; el.dataset.target = target; }

/* =====================================================================
   TREND
   ===================================================================== */
function trend(d, days) {
  const now = Date.now(), s0 = curSeg(d).start;
  const pts = d.history.filter(r => r.t >= now - days * D && r.t >= s0);
  if (pts.length < 3) return null;
  const xs = pts.map(p => (p.t - now) / D), ys = pts.map(p => p.pct), n = pts.length;
  const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  if (!den) return null;
  const slope = num / den;
  return { slope, intercept: my - slope * mx, from: pts[0].t, n };
}
function forecast(d, tr) {
  const p = last(d).pct, now = Date.now();
  if (statusOf(d) === 'offline' || !tr) return { crit: t('dt.na'), empty: t('dt.na') };
  if (tr.slope > -0.05) return { crit: p <= TH().critical ? t('dt.reached') : t('dt.stable'), empty: t('dt.stable') };
  const f = target => { const days = (p - target) / -tr.slope; return `${t('dt.inDays', { d: fmtNum(days, 1) })} · ${fmtDate(now + days * D)}`; };
  return { crit: p <= TH().critical ? t('dt.reached') : f(TH().critical), empty: f(0) };
}

function overviewDevices() {
  const q = norm(UI.search.trim()), { key, dir } = UI.sort;
  return devices.filter(d => {
    if (UI.status && statusOf(d) !== UI.status) return false;
    if (UI.city && d.city !== UI.city) return false;
    if (UI.owner === '__none' ? SH.owners[d.id] : UI.owner && SH.owners[d.id] !== UI.owner) return false;

    return !q || norm([d.id, d.name, d.city, d.district, d.plz, d.street, SH.owners[d.id]].join(' ')).includes(q);
  }).sort((a, b) => {
    let r = 0;
    if (key === 'id') r = a.id.localeCompare(b.id, undefined, { numeric: true });
    else if (key === 'loc') r = `${a.city} ${a.district} ${a.street}`.localeCompare(`${b.city} ${b.district} ${b.street}`, locale());
    else if (key === 'pct') r = last(a).pct - last(b).pct;

  });
}

/* ---------- Tagesstände: täglicher Abschluss aller Gerätezustände ---------- */
function lastDays(n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(dayKey(Date.now() - i * D)); return out; }
function computeDay(key) {
  if (key === todayKey()) return devices.map(d => ({ id: d.id, st: statusOf(d), pct: last(d).pct }));
  const end = new Date(key + 'T23:59:00').getTime(), th = TH();
  return devices.filter(d => d.activated <= end).map(d => {
    const lt = d.deadAt && end > d.deadAt ? d.deadAt : d.gap && end > d.gap.from && end < d.gap.to ? d.gap.from : end;
    const pct = valueAt(d, lt), off = end - lt > th.offlineHours * H;
    return { id: d.id, st: off ? 'offline' : pct < th.critical ? 'crit' : 'ok', pct };
  });
}
function dayState(key) { const s = SH.daily[key]; return s ? { rows: s.rows, at: s.at } : { rows: computeDay(key), at: null }; }
/* Tagesabschluss: abgeschlossene Tage speichern (produktiv: Server-Job jeden Tag um 00:00) */
function dailyClose() {
  let n = 0;
  for (let i = 1; i <= 7; i++) {
    const k = dayKey(Date.now() - i * D);
    if (!SH.daily[k] && devices.some(d => d.activated <= keyDate(k))) { SH.daily[k] = { at: Date.now(), rows: computeDay(k) }; n++; }
  }
  if (!n) return;
  const keys = Object.keys(SH.daily).sort(); while (keys.length > 400) delete SH.daily[keys.shift()];
  logAct('daily', { day: fmtDate(Date.now() - D) }, t('system'));
  saveShared();
}

const isMobile = () => matchMedia('(max-width: 820px)').matches || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);

function isTypingIn() {

    case 'tk-fixed': reportFixed(id); break;

      break;
    }
    case 'tk-card': {

      if (k === 'mine') { if (!S.me) { withName(() => { UI.tk.mine = true; renderTickets(); }); break; } UI.tk.mine = !UI.tk.mine; }
      else UI.tk.status = UI.tk.status === k ? 'active' : k;

document.addEventListener('change', e => {

    const id = el.dataset.id, f = el.dataset.tk, v = el.value;

    if (f === 'due') return withName(() => updateTicket(id, { due: v }));

  }
  if (el.dataset.if) {
    const k = el.dataset.if;

  }
  if (el.dataset.setting) return onSetting(el);
  if (el.id === 'set-me') { S.me = el.value.trim(); saveSettings(); if (S.me) addTeam(S.me, true); renderSide(); renderBadges(); syncInbox(); return; }

    case 'map-status': UI.map.status = el.value; renderMap(); break;

    case 'dt-trend-win': UI.trendWin = +el.value; renderDetail(); break;
    case 'dt-show-trend': UI.showTrend = el.checked; renderDetail(); break;
    case 'tk-status': UI.tk.status = el.value; renderTickets(); break;
    case 'tk-mine': if (el.checked && !S.me) { el.checked = false; withName(() => { UI.tk.mine = true; renderTickets(); }); } else { UI.tk.mine = el.checked; renderTickets(); } break;
    case 'hi-period': UI.hi.period = el.value; UI.hi.limit = 40; renderHistory(); break;
    case 'hi-model': UI.hi.model = el.value; UI.hi.limit = 40; renderHistory(); break;
    case 'dl-sort': UI.dl.sort = el.value; renderDevGrid(); break;

    const f = ifDraft, pv = $('#if-preview');
    if (pv && el.dataset.if.startsWith('map.')) pv.textContent = f.format === 'json'
      ? JSON.stringify({ [f.map.id]: 'TN-0007', [f.map.pct]: 18.1, [f.map.ts]: new Date(DataSource.lastPoll).toISOString(), [f.map.volt]: 3.46 }, null, 2)
      : `${f.map.id};${f.map.pct};${f.map.ts};${f.map.volt}\nTN-0007;18.1;${new Date(DataSource.lastPoll).toISOString()};3.46`;
    return;
  }
  if (el.dataset.setting === 'notify.emailAddr') { S.notify.emailAddr = el.value; saveSettings(); return; }
  switch (el.id) {
    case 'ov-search': UI.search = el.value; renderOverview(); break;
    case 'map-search': UI.map.search = el.value; renderMap(); break;
    case 'map-max': UI.map.maxPct = +el.value; renderMap(); break;
    case 'tk-search': UI.tk.search = el.value; renderTickets(); break;
    case 'dl-search': UI.dl.q = el.value; renderDevGrid(); break;
    case 'dy-search': UI.hi.dyq = el.value; $('#dy-table').innerHTML = dayTable(dayState(UI.hi.day || todayKey()).rows); break;
  }
});
document.addEventListener('keydown', e => {
  const inp = e.target.closest?.('.combo-in');
  if (inp && COMBOS[inp.dataset.combo]) {
    const c = COMBOS[inp.dataset.combo];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (inp.nextElementSibling.hidden) comboRender(inp);
      const n = c.items.length; c.active = n ? (c.active + (e.key === 'ArrowDown' ? 1 : -1) + n) % n : -1; comboRender(inp); return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const o = c.items[c.active] || (c.items.length === 1 ? c.items[0] : null) || (!inp.value.trim() && c.all !== null ? { v: '', l: '' } : null);
      if (o) comboPick(inp, o); return;
    }
    if (e.key === 'Escape' && !inp.nextElementSibling.hidden) { e.stopPropagation(); inp.value = comboLabel(inp.dataset.combo); comboClose(inp); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute?.('role') === 'button' && e.target.dataset.action) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape' && UI.modals.length) closeModal();
  if (e.key === 'Enter' && e.target.dataset?.enter) {
    e.preventDefault();
    const a = e.target.dataset.enter;
    $(`[data-action=${a}]${a === 'home-search' ? `[data-input=${e.target.id}]` : ''}`)?.click();
  }
});
function onSetting(el) {
  const path = el.dataset.setting, v = el.type === 'checkbox' ? el.checked : el.value;
  if (path === 'notify.browser' && v) {
    if (!('Notification' in window)) { toast(t('notif.unsupported'), 'warn'); el.checked = false; return; }
    Notification.requestPermission().then(p => { if (p !== 'granted') { S.notify.browser = false; saveSettings(); el.checked = false; toast(t('notif.denied'), 'warn'); } });
  }
  const ks = path.split('.'), k = ks.pop(); ks.reduce((a, x) => a[x], S)[k] = v;
  saveSettings();
  if (path === 'theme') { applyTheme(); refresh(); }
  if (path === 'lang') { applyI18n(); renderSettings(); refresh(); }
}
addEventListener('resize', () => { applyLayout(); if (comboOpenEl) comboPlace(comboOpenEl); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); refresh(); });

/* =====================================================================
   ANMELDUNG & START
   ===================================================================== */
function initApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  rebuildDevices();
  applyI18n();
  if (!LOC.inited) {
    LOC.inited = true;
    LOC.inbox.unshift({ id: uid('m'), t: Date.now(), kind: 'admin', title: t('msg.welcome.t'), body: t('msg.welcome.b'), read: false, flagged: true });
    saveLocal();
  }
  dailyClose();
  syncIncidents();
  refresh();
  DataSource.start();
  loadSignals(false);
}
function initLogin() {
  applyTheme(); applyLayout();
  document.documentElement.lang = S.lang;
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">${RACCOON_PATHS}</svg>`);
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $('#login-logo').innerHTML = raccoon(84);
  $('#login-hint').hidden = CONFIG.APP_PASSWORD !== '';
  if (sessionStorage.getItem('bb-auth') === '1') return initApp();
  $('#login').hidden = false;
  $('#login-pw').focus();
  $('#login-form').addEventListener('submit', e => {
    e.preventDefault();
    // Hinweis: Eine Passwortprüfung im Browser hält nur zufällige Besucher fern. Produktiv serverseitig prüfen.
    if ($('#login-pw').value === CONFIG.APP_PASSWORD) { sessionStorage.setItem('bb-auth', '1'); initApp(); }
    else { $('#login-error').textContent = t('login.wrong'); const c = $('#login-card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  });
}
initLogin();
</script>
