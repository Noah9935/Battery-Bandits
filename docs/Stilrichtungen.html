<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Bandits, vier Stilrichtungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

/* Umschalter oben (gehört nicht zu den Entwürfen) */
.picker { position: fixed; z-index: 1000; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 999px;
  background: rgba(30, 30, 32, 0.86); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
.picker button { border: 0; background: transparent; color: #c9c9ce; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.picker button b { color: #8e8e93; font-weight: 600; margin-right: 6px; }
.picker button.on { background: #fff; color: #1d1d1f; }
.picker button.on b { color: #6e6e73; }
.concept { display: none; min-height: 100vh; padding-bottom: 90px; }
.concept.on { display: block; animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.spark { display: block; }

/* ============ A: Apple Minimal (hell) ============ */
.A { background: #fff; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", sans-serif; }
.A .nav { position: sticky; top: 0; z-index: 10; height: 48px; display: flex; align-items: center; justify-content: center; gap: 36px; background: rgba(255,255,255,.8);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); font-size: 12px; color: #424245; }
.A .nav .logo { position: absolute; left: 24px; display: flex; align-items: center; gap: 8px; font-weight: 600; color: #1d1d1f; }
.A .nav .logo img { width: 22px; height: 22px; }
.A .nav a.on { color: #1d1d1f; font-weight: 500; }
.A .nav .me { position: absolute; right: 24px; color: #6e6e73; }
.A .hero { max-width: 980px; margin: 0 auto; padding: 88px 24px 56px; text-align: center; }
.A .eyebrow { font-size: 17px; font-weight: 600; color: #bf4800; margin-bottom: 8px; }
.A h1 { font-size: 64px; line-height: 1.07; font-weight: 600; letter-spacing: -0.03em; }
.A .lead { font-size: 24px; line-height: 1.3; font-weight: 400; color: #6e6e73; margin-top: 14px; letter-spacing: -0.01em; }
.A .cta { display: flex; justify-content: center; align-items: center; gap: 28px; margin-top: 30px; font-size: 19px; }
.A .pill { background: #0071e3; color: #fff; padding: 11px 22px; border-radius: 980px; font-size: 17px; }
.A .more { color: #0066cc; }
.A .more::after { content: " \203A"; }
.A .figures { max-width: 980px; margin: 0 auto; padding: 24px 24px 72px; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
.A .fig b { display: block; font-size: 64px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
.A .fig span { display: block; margin-top: 10px; font-size: 14px; color: #6e6e73; }
.A .fig.crit b { color: #d70015; }
.A .tile { max-width: 1080px; margin: 0 auto 24px; background: #f5f5f7; border-radius: 28px; padding: 48px 48px 28px; }
.A .tile h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
.A .tile .sub { color: #6e6e73; font-size: 17px; margin-bottom: 26px; }
.A .alert { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 20px 0; border-top: 1px solid #d2d2d7; }
.A .alert:first-of-type { border-top: 0; }
.A .alert strong { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; }
.A .alert p { color: #6e6e73; margin-top: 2px; font-size: 15px; }
.A .alert .acts { display: flex; gap: 22px; font-size: 15px; color: #0066cc; }
.A .list { max-width: 1080px; margin: 0 auto; padding: 24px 48px 60px; }
.A .list h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 22px; }
.A .row { display: grid; grid-template-columns: 1.1fr 0.9fr 1fr 1fr 1fr 1fr; align-items: center; gap: 12px; padding: 17px 16px; border-radius: 16px; font-size: 15px; transition: background .2s; }
.A .row:hover { background: #f5f5f7; }
.A .row.head { color: #86868b; font-size: 12px; padding-top: 0; padding-bottom: 8px; }
.A .row.head:hover { background: none; }
.A .row .id { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.A .row .src { display: block; font-size: 12px; color: #86868b; font-weight: 400; }
.A .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
.A .st-critical .dot { background: #ff3b30; } .A .st-warning .dot { background: #ff9500; } .A .st-normal .dot { background: #34c759; } .A .st-offline .dot { background: #c7c7cc; }
.A .bar { height: 4px; border-radius: 2px; background: #e8e8ed; margin-top: 7px; width: 90px; overflow: hidden; }
.A .bar i { display: block; height: 100%; background: #1d1d1f; border-radius: 2px; }
.A .muted { color: #6e6e73; }

/* ============ B: Waschbär Warm (der ursprüngliche Look, verfeinert) ============ */
.B { background: #f3f0eb; color: #26232a; font-family: Nunito, -apple-system, "Segoe UI", sans-serif; display: none; }
.B.on { display: grid; grid-template-columns: 236px 1fr; }
.B .side { position: sticky; top: 0; height: 100vh; background: #2a272d; color: #ece6de; display: flex; flex-direction: column; }
.B .brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 14px; font-weight: 800; font-size: 16px; }
.B .brand img { width: 40px; height: 40px; border-radius: 10px; background: #fff; padding: 2px; }
.B .stripes { height: 6px; margin: 0 20px 18px; border-radius: 3px; background: repeating-linear-gradient(90deg, #2a272d 0 18px, #9a928a 18px 36px); outline: 1px solid #4a454d; }
.B .side a { display: flex; align-items: center; justify-content: space-between; margin: 2px 12px; padding: 10px 12px; border-radius: 10px; color: #a39b92; font-weight: 700; font-size: 14px; }
.B .side a.on { background: rgba(255,255,255,.09); color: #ece6de; }
.B .side a i { font-style: normal; background: #c84d38; color: #fff; border-radius: 10px; font-size: 11px; font-weight: 800; padding: 1px 7px; }
.B .side a i.cu { background: #b87428; }
.B .me { margin-top: auto; padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08); font-size: 13px; color: #a39b92; }
.B .main { padding: 30px 38px 60px; }
.B h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
.B .subtle { color: #7c756d; font-size: 14px; margin-top: 4px; }
.B .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 22px 0; }
.B .card { background: #fff; border-radius: 14px; box-shadow: 0 1px 2px rgba(42,39,45,.06), 0 8px 24px rgba(42,39,45,.05); }
.B .stat { padding: 16px 20px; }
.B .stat span { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #7c756d; }
.B .stat b { display: block; font-size: 34px; font-weight: 800; margin-top: 6px; }
.B .stat.sel { outline: 2px solid #b87428; }
.B .stat .d { width: 8px; height: 8px; border-radius: 50%; }
.B .panel { padding: 20px 22px; margin-bottom: 18px; }
.B .panel h2 { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
.B .a { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid #efe9e0; font-size: 14px; }
.B .a:first-of-type { border-top: 0; }
.B .pl { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.B .pl::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.B .pl.critical { background: #fbe9e5; color: #c84d38; } .B .pl.warning { background: #fbf1dc; color: #c08417; } .B .pl.normal { background: #e7f3ec; color: #3d8a62; } .B .pl.offline { background: #efebe6; color: #8f877f; }
.B .btn { border: 0; border-radius: 10px; padding: 7px 14px; font-weight: 800; font-size: 13px; background: #f3efe8; }
.B .btn.p { background: #b87428; color: #fff; }
.B table { width: 100%; border-collapse: collapse; font-size: 14px; }
.B th { text-align: left; font-size: 12px; color: #7c756d; font-weight: 700; padding: 8px 10px; }
.B td { padding: 12px 10px; border-top: 1px solid #efe9e0; }
.B .bar { height: 7px; width: 100px; border-radius: 4px; background: #efe9e0; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
.B .bar i { display: block; height: 100%; background: #b87428; }
.B .src { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #f8ebda; color: #94591a; margin-left: 6px; }
.B .src.s { background: transparent; border: 1px dashed #d8d0c4; color: #7c756d; }

/* ============ C: Kino Dunkel (Apple Produktseite dunkel) ============ */
.C { background: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", sans-serif; }
.C .nav { position: sticky; top: 0; z-index: 10; height: 48px; display: flex; align-items: center; justify-content: center; gap: 36px; background: rgba(22,22,23,.8);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); font-size: 12px; color: #a1a1a6; }
.C .nav .logo { position: absolute; left: 24px; display: flex; align-items: center; gap: 8px; font-weight: 600; color: #f5f5f7; }
.C .nav .logo img { width: 22px; height: 22px; }
.C .nav a.on { color: #f5f5f7; }
.C .nav .me { position: absolute; right: 24px; }
.C .hero { max-width: 1100px; margin: 0 auto; padding: 110px 24px 40px; text-align: center; }
.C .big { font-size: 168px; line-height: 0.95; font-weight: 700; letter-spacing: -0.06em; color: #ff453a; }
.C h1 { font-size: 48px; font-weight: 600; letter-spacing: -0.03em; margin-top: 10px; }
.C .lead { font-size: 21px; color: #86868b; margin-top: 10px; }
.C .cta { margin-top: 28px; display: flex; gap: 14px; justify-content: center; }
.C .pill { background: #0a84ff; color: #fff; padding: 12px 24px; border-radius: 980px; font-size: 17px; }
.C .ghost { border: 1px solid #0a84ff; color: #2997ff; padding: 11px 24px; border-radius: 980px; font-size: 17px; }
.C .tiles { max-width: 1100px; margin: 60px auto 0; padding: 0 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.C .t { background: #1d1d1f; border-radius: 28px; padding: 30px 30px 28px; min-height: 200px; }
.C .t span { font-size: 14px; color: #86868b; }
.C .t b { display: block; font-size: 72px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; margin-top: 18px; }
.C .t em { font-style: normal; font-size: 15px; color: #86868b; }
.C .t.w b { color: #ff9f0a; } .C .t.o b { color: #8e8e93; } .C .t.n b { color: #30d158; }
.C .list { max-width: 1100px; margin: 60px auto 0; padding: 0 24px; }
.C .list h2 { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 20px; }
.C .group { background: #1d1d1f; border-radius: 28px; padding: 14px; }
.C .row { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr 1fr; gap: 12px; align-items: center; padding: 16px 20px; border-radius: 18px; font-size: 15px; transition: background .2s; }
.C .row:hover { background: #2c2c2e; }
.C .row .id { font-size: 17px; font-weight: 600; }
.C .row .src { display: block; font-size: 12px; color: #86868b; font-weight: 400; }
.C .c-critical { color: #ff453a; } .C .c-warning { color: #ff9f0a; } .C .c-normal { color: #30d158; } .C .c-offline { color: #8e8e93; }
.C .muted { color: #86868b; }
.C .bar { height: 4px; border-radius: 2px; background: #3a3a3c; margin-top: 7px; width: 90px; overflow: hidden; }
.C .bar i { display: block; height: 100%; background: #f5f5f7; border-radius: 2px; }

/* ============ D: Swiss Typo (nüchtern, Raster, eine Signalfarbe) ============ */
.D { background: #fafaf8; color: #111; font-family: Inter, -apple-system, "Segoe UI", sans-serif; }
.D .top { display: grid; grid-template-columns: 260px 1fr auto; align-items: center; border-bottom: 1px solid #111; height: 56px; padding: 0 28px; }
.D .top .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; }
.D .top .logo img { width: 24px; height: 24px; }
.D .top nav { display: flex; gap: 26px; font-size: 13px; color: #6b6b66; }
.D .top nav a.on { color: #111; box-shadow: 0 2px 0 #111; padding-bottom: 4px; }
.D .top .me { font-size: 12px; color: #6b6b66; }
.D .wrap { padding: 0 28px 70px; }
.D .headline { display: grid; grid-template-columns: 260px 1fr; padding: 44px 0 34px; border-bottom: 1px solid #111; }
.D .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6b66; font-weight: 500; }
.D h1 { font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: -0.04em; max-width: 14em; }
.D h1 em { font-style: normal; color: #ff4f00; }
.D .figs { display: grid; grid-template-columns: 260px repeat(4, 1fr); border-bottom: 1px solid #111; }
.D .figs > div { padding: 22px 0; }
.D .figs b { display: block; font-size: 52px; font-weight: 500; letter-spacing: -0.05em; line-height: 1; margin-top: 12px; font-variant-numeric: tabular-nums; }
.D .figs .crit b { color: #ff4f00; }
.D .sec { display: grid; grid-template-columns: 260px 1fr; padding: 28px 0; border-bottom: 1px solid #111; }
.D .a { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; padding: 11px 0; border-top: 1px solid #deded8; font-size: 14px; align-items: baseline; }
.D .a:first-child { border-top: 0; padding-top: 0; }
.D .a b { font-weight: 600; }
.D .a .go { color: #ff4f00; font-weight: 500; }
.D table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.D th { text-align: left; font-weight: 500; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6b66; padding: 0 0 10px; }
.D td { padding: 11px 0; border-top: 1px solid #deded8; font-variant-numeric: tabular-nums; }
.D td.id { font-weight: 600; }
.D th, .D td { padding-right: 18px; white-space: nowrap; }
.D .tag { display: inline-block; width: 8px; height: 8px; margin-right: 8px; }
.D .t-critical { background: #ff4f00; } .D .t-warning { background: #111; border-radius: 50%; } .D .t-normal { background: transparent; border: 1.5px solid #111; border-radius: 50%; } .D .t-offline { background: transparent; border: 1.5px dashed #6b6b66; }
.D .bar { height: 3px; background: #deded8; width: 100px; display: inline-block; vertical-align: middle; margin-right: 10px; }
.D .bar i { display: block; height: 100%; background: #111; }
.D .muted { color: #6b6b66; }

@media (max-width: 900px) {
  .A h1 { font-size: 40px; } .A .lead { font-size: 18px; } .A .figures { grid-template-columns: repeat(2, 1fr); gap: 32px; } .A .fig b { font-size: 44px; }
  .A .tile, .A .list { padding-left: 20px; padding-right: 20px; border-radius: 20px; } .A .row { grid-template-columns: 1fr 1fr; } .A .row .hide, .A .row.head { display: none; }
  .B.on { grid-template-columns: 1fr; } .B .side { display: none; } .B .stats { grid-template-columns: repeat(2, 1fr); }
  .C .big { font-size: 100px; } .C h1 { font-size: 32px; } .C .tiles { grid-template-columns: 1fr; } .C .row { grid-template-columns: 1fr 1fr; } .C .row .hide { display: none; }
  .D .headline, .D .sec { grid-template-columns: 1fr; gap: 12px; } .D .figs { grid-template-columns: repeat(2, 1fr); } .D .figs > div:first-child { grid-column: 1 / -1; } .D .top { grid-template-columns: 1fr auto; } .D .top nav { display: none; }
  .picker { max-width: 96vw; overflow: auto; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<div id="A" class="concept A"></div>
<div id="B" class="concept B"></div>
<div id="C" class="concept C"></div>
<div id="D" class="concept D"></div>

<div class="picker" role="tablist" aria-label="Stilrichtung">

</div>

}
