name: Update PlantUML diagrams

on:
  push:
    paths:
      - "docs/**/*.puml"

permissions:
  contents: write

jobs:
  plantuml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre graphviz

      - name: Download PlantUML
        run: |
          wget -q https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar -O plantuml.jar

      - name: Generate SVG diagrams
        run: |
          find docs -name "*.puml" -print0 | xargs -0 java -jar plantuml.jar -tsvg

      - name: Commit updated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Update PlantUML diagrams"
          git pull --rebase
          git push
