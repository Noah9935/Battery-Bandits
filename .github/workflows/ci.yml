name: CI

# Prüfen läuft bei jedem Push auf jeden Branch und bei Pull Requests. Danach rollt der Job "Ausrollen" aus:
#   Push auf einen Feature-Branch  ->  Staging (Port 20210)
#   Push auf main                  ->  Prod (Port 20200), ersetzt die Seite "In Bearbeitung"
# Von Hand (Reiter Actions, "Run workflow") lässt sich das Ziel wählen. Einrichtung: docs/deployment.md.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Wohin ausrollen?"
        type: choice
        options: [staging, prod]
        default: staging

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatierung, Clippy, Tests und Abdeckung der Kernlogik (Vorlesung: Ziel 80 Prozent)
  checks:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: batterybandits
          POSTGRES_USER: batterybandits
          POSTGRES_PASSWORD: batterybandits
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U batterybandits -d batterybandits"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://batterybandits:batterybandits@localhost:5432/batterybandits
      MQTT_HOST: localhost
      MQTT_PORT: "1883"
    steps:
      - uses: actions/checkout@v4

      # Der Mosquitto aus docker-compose.dev.yml: offener Broker nur für die Tests.
      - name: Mosquitto starten
        run: docker run -d --name mosquitto -p 1883:1883 -v "${{ github.workspace }}/dev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --all --check

      - name: Clippy (Dienste und Bibliothek)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (Weboberfläche für WebAssembly)
        run: cargo clippy -p frontend --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Abdeckung der Kernlogik (mindestens 80 Prozent der Zeilen)
        run: bash tools/coverage.sh

  # Baut alle Images (cargo-chef) und startet den ganzen Stack mit Simulator
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Stack bauen und starten
        working-directory: deploy
        run: docker compose --env-file .env.local.example --profile local up -d --build

      - name: Durchstich prüfen
        run: bash tools/smoke.sh http://localhost:8080

      - name: Protokolle bei Fehlern
        if: failure()
        working-directory: deploy
        run: docker compose --env-file .env.local.example --profile local logs --no-color --tail 100

      - name: Aufräumen
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env.local.example --profile local down -v

  # Baut den geprüften Stand auf dem Schulserver und startet die Umgebung. Der Server baut selbst, die Zugänge
  # liegen nur in den GitHub-Secrets (siehe docs/deployment.md). Pull Requests rollen nie aus.
  deploy:
    name: Ausrollen
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name != 'prod')
    timeout-minutes: 60
    # Ein Lauf zur Zeit: Der Server baut sonst doppelt. Ein neuer Push wartet auf den laufenden.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Ziel bestimmen
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET=prod
          else
            TARGET=staging
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "DIR=battery-bandits/$TARGET" >> "$GITHUB_ENV"
          echo "Ziel: $TARGET (Branch ${{ github.ref_name }})"

      - name: Zugang vorbereiten
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::error::Die Secrets fehlen (DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST, DEPLOY_USER). Siehe docs/deployment.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          {
            echo "Host server"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port ${DEPLOY_PORT:-22}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          ssh server 'echo "Verbindung steht: $(hostname)"'

      - name: Stand auf den Server übertragen
        run: |
          git archive --format=tar.gz -o src.tar.gz HEAD
          ssh server "mkdir -p ~/$DIR/src && rm -rf ~/$DIR/src/* && test -f ~/$DIR/.env || { echo 'Auf dem Server fehlt ~/$DIR/.env (siehe docs/deployment.md)'; exit 1; }"
          scp src.tar.gz "server:$DIR/src.tar.gz"
          ssh server "cd ~/$DIR && tar -xzf src.tar.gz -C src && rm src.tar.gz"

      - name: Bauen (der erste Lauf dauert mehrere Minuten)
        run: |
          ssh server "cd ~/$DIR/src/deploy && docker compose --env-file ../../.env build"

      # Erst nach dem Bauen: Die Seite "In Bearbeitung" bleibt, solange gebaut wird, und macht dann Platz
      # (sie belegt denselben Port). Nur bei Prod, und nur wenn sie noch läuft.
      - name: Seite "In Bearbeitung" beenden (nur Prod)
        if: env.TARGET == 'prod'
        run: |
          ssh server "cd ~/$DIR/src/deploy/coming-soon && docker compose --env-file ../../../.env down --remove-orphans || true"

      - name: Starten
        run: |
          ssh server "cd ~/$DIR/src/deploy && docker compose --env-file ../../.env up -d --no-build --remove-orphans"

      - name: Prüfen, ob die Umgebung antwortet
        run: |
          PORT=$(ssh server "grep '^WEB_PORT=' ~/$DIR/.env | cut -d= -f2")
          if [ "$TARGET" = "prod" ]; then URL="https://batterybandits.racore.net"; else URL="https://staging.batterybandits.racore.net"; fi
          for i in $(seq 1 40); do
            START=$(ssh server "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/" || true)
            API=$(ssh server "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/api/summary" || true)
            echo "Versuch $i: Startseite $START, Schnittstelle ohne Anmeldung $API (erwartet 200 und 401)"
            if [ "$START" = "200" ] && [ "$API" = "401" ]; then
              {
                echo "### $TARGET läuft"
                echo ""
                echo "- Stand: \`$(git rev-parse --short HEAD)\` ($(git log -1 --format=%s))"
                echo "- Branch: ${{ github.ref_name }}"
                echo "- Port auf dem Server: $PORT"
                echo "- Im Netz: $URL"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$TARGET antwortet nicht. Letzte Meldungen der Dienste:"
          ssh server "cd ~/$DIR/src/deploy && docker compose --env-file ../../.env ps && docker compose --env-file ../../.env logs --tail 30" || true
          exit 1
