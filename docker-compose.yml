# Gesamter Stack für die lokale Entwicklung und für Tests.
#
#   docker compose --profile dev up --build     alles inklusive Broker und Simulator
#   docker compose up --build                   gegen einen vorhandenen Broker (siehe .env.example)
#
# Dashboard: http://localhost:8080
# Die Werte lassen sich über eine .env-Datei überschreiben (Vorlage: .env.example).

name: battery-bandits

x-service: &service
  restart: unless-stopped
  depends_on:
    db:   { condition: service_healthy }
    nats: { condition: service_healthy }
  environment: &service-env
    DATABASE_URL: postgres://${POSTGRES_USER:-batterybandits}:${POSTGRES_PASSWORD:-batterybandits}@db:5432/${POSTGRES_DB:-batterybandits}
    NATS_URL: nats://nats:4222
    RUST_LOG: ${RUST_LOG:-info}

services:
  # ---------- Infrastruktur ----------
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batterybandits}
      POSTGRES_USER: ${POSTGRES_USER:-batterybandits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batterybandits}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batterybandits} -d ${POSTGRES_DB:-batterybandits}"]
      interval: 3s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ---------- Dienste (Rust) ----------
  ingest:
    <<: *service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { PACKAGE: ingest } }
    environment:
      <<: *service-env
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-trafficnode/+/battery}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-battery-bandits-ingest}

  monitor:
    <<: *service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { PACKAGE: monitor } }
    environment:
      <<: *service-env
      CRITICAL_THRESHOLD_PCT: ${CRITICAL_THRESHOLD_PCT:-20}

  incidents:
    <<: *service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { PACKAGE: incidents } }

  api:
    <<: *service
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { PACKAGE: api } }

  web:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]

  # ---------- Nur für die Entwicklung (Profil dev) ----------
  mosquitto:
    profiles: [dev]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports: ["127.0.0.1:${MOSQUITTO_PORT:-1883}:1883"]

  simulator:
    profiles: [dev]
    restart: unless-stopped
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { PACKAGE: simulator } }
    depends_on: [mosquitto]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SIM_DEVICES: ${SIM_DEVICES:-60}
      SIM_INTERVAL_SECS: ${SIM_INTERVAL_SECS:-10}
      SIM_TIME_SCALE: ${SIM_TIME_SCALE:-2000}
      SIM_INVALID_RATE: ${SIM_INVALID_RATE:-0.02}
      RUST_LOG: ${RUST_LOG:-info}

volumes:
  db-data:
  nats-data:
  mosquitto-data:
