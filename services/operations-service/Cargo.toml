[package]
name = "operations-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Meldungs- und Einsatz-Service: Meldungen bei kritischen oder offline Geräten, Batteriewechsel planen und bestätigen"

[dependencies]
shared = { workspace = true, features = ["sqlx"] }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
# Versand der Weiterleitungen: E-Mail über SMTP.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Der nachgestellte Mailserver der Tests liest Zeilen vom Socket.
tokio = { workspace = true, features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
