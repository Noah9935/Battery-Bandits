[workspace]
resolver = "3"
members = ["shared", "kit", "ingest", "monitor", "incidents", "api", "web", "simulator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
shared = { path = "shared" }
kit = { path = "kit" }

anyhow = "1"
async-nats = "0.51"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
futures-util = "0.3"
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Die Web-App wird nach WebAssembly kompiliert und soll klein bleiben.
[profile.release.package.web]
opt-level = "s"
