<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battery Bandits, kommt bald</title>
    <meta name="description" content="Battery Bandits überwacht die Batterien von TrafficNodes. Die Seite ist bald verfügbar." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b87428'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #f3f0eb; --panel: #ffffff; --text: #26232a; --muted: #6f6a72; --line: #e2ddd5; --accent: #b87428;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #131215; --panel: #1c1a1f; --text: #ece6de; --muted: #a39da6; --line: #2d2a31; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: grid; place-items: center; min-height: 100vh; padding: 1.5rem;
        background: var(--bg); color: var(--text);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      main {
        width: min(520px, 100%); text-align: center; padding: 2.5rem 1.75rem 2rem;
        background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
        box-shadow: 0 1px 2px rgba(38, 35, 42, 0.06), 0 12px 32px rgba(38, 35, 42, 0.08);
      }
      .logo { width: 84px; height: 84px; }
      .badge {
        display: inline-block; margin-top: 1.25rem; padding: 0.2rem 0.85rem; border-radius: 999px;
        font-size: 0.8rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      }
      h1 { margin: 0.75rem 0 0.25rem; font-size: 1.9rem; letter-spacing: -0.01em; }
      p { margin: 0.6rem 0 0; color: var(--muted); }
      a { color: var(--accent); }
      footer { margin-top: 1.75rem; font-size: 0.85rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Waschbär">
        <circle cx="32" cy="32" r="30" fill="#b87428"></circle>
        <path d="M10 22 L18 8 L28 18 Z M54 22 L46 8 L36 18 Z" fill="#3a3238"></path>
        <ellipse cx="32" cy="36" rx="22" ry="19" fill="#9a928b"></ellipse>
        <path d="M10 33 Q32 22 54 33 L52 44 Q32 38 12 44 Z" fill="#3a3238"></path>
        <ellipse cx="22" cy="35" rx="5" ry="4" fill="#f3f0eb"></ellipse>
        <ellipse cx="42" cy="35" rx="5" ry="4" fill="#f3f0eb"></ellipse>
        <circle cx="22" cy="35" r="2" fill="#26232a"></circle>
        <circle cx="42" cy="35" r="2" fill="#26232a"></circle>
        <ellipse cx="32" cy="46" rx="4" ry="3" fill="#26232a"></ellipse>
      </svg>
      <div class="badge">Kommt bald</div>
      <h1>Battery Bandits</h1>
      <p>Wir bauen gerade die Batterieüberwachung für TrafficNodes. Ladezustand, Standorte und Batteriewechsel an einem Ort.</p>
      <p>Die Vorschau läuft unter <a href="https://staging.batterybandits.racore.net">staging.batterybandits.racore.net</a>.</p>
      <footer>Ein Projekt der DHBW Stuttgart, Software Engineering I</footer>
    </main>
  </body>
</html>
