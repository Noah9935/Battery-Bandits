# Banner "Kommt bald" für die Prod-Domain, solange Prod noch nicht ausgerollt ist.
#
#   docker compose --env-file ../../../.env up -d      (auf dem Server, siehe deploy.ps1 banner)
#
# Erwartet in der .env: COMPOSE_PROJECT_NAME=bb-prod, WEB_PORT=20200 und WEB_BIND=0.0.0.0 (Vorlage: ../.env.prod.example).
name: ${COMPOSE_PROJECT_NAME:-bb-prod}

services:
  banner:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:?WEB_PORT fehlt}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - ../../assets/logo/battery-bandits-logo.svg:/srv/battery-bandits-logo.svg:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
