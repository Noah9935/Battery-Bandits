# Battery Bandits: alle Dienste in einem Compose-Projekt.
#
#   Betrieb (Staging oder Prod): Zugangsdaten und Ports stehen in der .env der Umgebung.
#     docker compose --env-file .env up -d --build
#
#   Lokal mit Simulator und eigenem Mosquitto (ohne den gemeinsamen Broker anzufassen):
#     docker compose --env-file .env.local.example --profile local up --build
#
#   Staging mit echten Daten UND erfundenen Testgeräten (Profil "sim"): Ein eigener Mosquitto und ein zweiter
#   Ingestion-Dienst nehmen nur die erfundenen Geräte auf (alle als "Erfunden" gekennzeichnet), der gemeinsame
#   Broker der Vorlesung bleibt unberührt. In der .env der Umgebung: COMPOSE_PROFILES=sim (50 feste Nodes SIM01 bis SIM50).
#
# Nach außen sind nur zwei Ports offen: die Weboberfläche (WEB_PORT, gebunden an WEB_BIND, Vorgabe
# 127.0.0.1) und die Datenbank (DB_PORT, immer nur 127.0.0.1). Alles andere läuft im internen Netz
# "backend". Auf dem Schulserver steht WEB_BIND=0.0.0.0, damit die Oberfläche direkt unter
# http://<domain>:<WEB_PORT> erreichbar ist (der zentrale Caddy läuft in einem eigenen Docker-Netz
# und erreicht Ports auf 127.0.0.1 nicht).

name: ${COMPOSE_PROJECT_NAME:-battery-bandits}

x-service-env: &service-env
  RUST_LOG: ${RUST_LOG:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER fehlt}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@timescaledb:5432/${POSTGRES_DB:?POSTGRES_DB fehlt}

x-build: &build
  context: ..
  dockerfile: deploy/docker/services.Dockerfile

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT fehlt}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Nur lokal und auf Staging (Profile "local" und "sim"): offener Broker für den Simulator. Im Betrieb liefert der
  # gemeinsame Broker mqtt.ti-labs.ai die echten Daten.
  mosquitto:
    profiles: [local, sim]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ../dev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [backend]

  ingestion:
    build: { <<: *build, target: ingestion-service }
    image: battery-bandits/ingestion-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
    environment:
      <<: *service-env
      MQTT_HOST: ${MQTT_HOST:?MQTT_HOST fehlt}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-traffic-nodes/+/measurements}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:?MQTT_CLIENT_ID fehlt (je Umgebung eindeutig)}
      # Herkunft der Daten: dozent (echt, Vorgabe) oder simulation (erfunden, nur mit dem lokalen Simulator)
      DATA_SOURCE: ${DATA_SOURCE:-dozent}
    networks: [backend]

  # Nur mit Profil "sim": nimmt die erfundenen Geräte vom eigenen Mosquitto auf (Herkunft: simulation). Nutzt das Image
  # des Ingestion-Dienstes, der echte Dienst bleibt unverändert am Broker der Vorlesung.
  ingestion-sim:
    profiles: [sim]
    image: battery-bandits/ingestion-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
      mosquitto: { condition: service_started }
      ingestion: { condition: service_started }
    environment:
      <<: *service-env
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
      MQTT_USER: ""
      MQTT_PASSWORD: ""
      MQTT_TOPIC_FILTER: traffic-nodes/+/measurements
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:?MQTT_CLIENT_ID fehlt}-sim
      DATA_SOURCE: simulation
    networks: [backend]

  monitoring:
    build: { <<: *build, target: monitoring-service }
    image: battery-bandits/monitoring-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
    environment:
      <<: *service-env
      SWEEP_INTERVAL_SECS: ${SWEEP_INTERVAL_SECS:-15}
      FORECAST_INTERVAL_SECS: ${FORECAST_INTERVAL_SECS:-60}
      # Platz der Datenbank in Megabyte (Vorgabe 10 GB, so viel hat die Gruppe). Ab 95 Prozent löscht die Überwachung die
      # ältesten Messwerte, alle zehn Minuten geprüft. Dieselbe Einstellung nutzt das Dashboard für die Anzeige.
      DB_QUOTA_MB: ${DB_QUOTA_MB:-10240}
    networks: [backend]

  operations:
    build: { <<: *build, target: operations-service }
    image: battery-bandits/operations-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
    environment:
      <<: *service-env
      OPERATIONS_ADDR: 0.0.0.0:8082
      # Weiterleitung neuer Meldungen per E-Mail. Sie ist nur eingeschaltet, wenn der Zugang gesetzt ist
      # (siehe docs/deployment.md). Die Werte stehen in der .env der Umgebung, nie im Repository.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
    networks: [backend]

  dashboard:
    build: { <<: *build, target: dashboard-service }
    image: battery-bandits/dashboard-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
      operations: { condition: service_started }
    environment:
      <<: *service-env
      DASHBOARD_ADDR: 0.0.0.0:8080
      OPERATIONS_URL: http://operations:8082
      # Anmeldung: Konten kommen aus BB_USERS (name:passwort:Anzeigename;...), das Cookie wird hinter HTTPS als Secure gesetzt.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BB_USERS: ${BB_USERS:-}
      # Platz für die Datenbank in Megabyte (Vorgabe 10 GB) für die Anzeige der Auslastung. Hat die Festplatte weniger
      # Platz, gilt der echte Platz. Gelöscht wird vom Überwachungs-Dienst (siehe dort).
      DB_QUOTA_MB: ${DB_QUOTA_MB:-10240}
    networks: [backend]

  caddy:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      target: web
    image: battery-bandits/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      dashboard: { condition: service_started }
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:?WEB_PORT fehlt}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  # Nur lokal (Profil "local"): fängt alle E-Mails ab, damit die Weiterleitung und der Test-Knopf funktionieren,
  # ohne dass eine echte Mail rausgeht. Die gesendeten Mails stehen unter http://localhost:8025.
  mailpit:
    profiles: [local]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [backend]

  # Nur lokal und auf Staging (Profile "local" und "sim"): erfundene Messwerte von TrafficNodes in den eigenen Mosquitto.
  test-publisher:
    profiles: [local, sim]
    build: { <<: *build, target: test-publisher }
    image: battery-bandits/test-publisher:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}-publisher
      SIM_INTERVAL_SECS: ${SIM_INTERVAL_SECS:-10}
      # 1 ist Echtzeit, genau wie bei den Nodes der Vorlesung. Höher beschleunigt die Entladung für Vorführungen.
      SIM_SPEEDUP: ${SIM_SPEEDUP:-1}
      SIM_INVALID_RATE: ${SIM_INVALID_RATE:-0.03}
      # So viele der 50 festen Nodes (SIM01, SIM02 ...) senden, höchstens 50. Alle gelten als "erfunden".
      SIM_DEVICES: ${SIM_DEVICES:-50}
    depends_on:
      - mosquitto
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
